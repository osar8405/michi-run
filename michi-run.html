<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Michi Run: ¡Huye de los Perros!</title>
<style>
:root{ --neon:#ffd93d; --neon2:#6bf0c2; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#12122a;overflow:hidden;height:100%;width:100%;touch-action:none;overscroll-behavior:none;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#23234d,#0c0c1e 75%);}
canvas#game{display:block;background:#87ceeb;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:20;}
#touch.on{display:block;}
.tbtn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  border-radius:22%;border:3px solid rgba(255,255,255,.55);background:rgba(30,30,70,.42);
  color:#fff;font-weight:bold;user-select:none;-webkit-user-select:none;letter-spacing:1px;
  text-shadow:0 2px 3px rgba(0,0,0,.6);backdrop-filter:blur(2px);}
.tbtn:active,.tbtn.act{background:rgba(255,217,61,.55);border-color:#fff;}
#tLeft{left:2.5vmin;bottom:3vmin;width:15vmin;height:15vmin;font-size:6vmin;}
#tRight{left:19.5vmin;bottom:3vmin;width:15vmin;height:15vmin;font-size:6vmin;}
#tJump{right:2.5vmin;bottom:3vmin;width:19vmin;height:19vmin;font-size:4.4vmin;background:rgba(60,120,255,.4);}
#tDash{right:23vmin;bottom:3vmin;width:14vmin;height:14vmin;font-size:3.6vmin;background:rgba(255,90,120,.38);}
#tPhase{right:2.5vmin;bottom:24vmin;width:14vmin;height:14vmin;font-size:3.4vmin;background:rgba(150,90,255,.4);}
#tPause{right:2vmin;top:2vmin;width:10vmin;height:8vmin;font-size:3.4vmin;background:rgba(20,20,50,.5);}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="tbtn" id="tLeft">◀</div>
  <div class="tbtn" id="tRight">▶</div>
  <div class="tbtn" id="tJump">SALTO</div>
  <div class="tbtn" id="tDash">DASH</div>
  <div class="tbtn" id="tPhase">FASE</div>
  <div class="tbtn" id="tPause">II</div>
</div>
<script>
'use strict';
/* ============================================================
   MICHI RUN — self-contained endless platformer
   Modules: input / audio / particles / physics / entities /
            world gen / dogs / collectibles / render / UI / loop
   ============================================================ */

// ---------- Canvas & DPR setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const VIEW_W = 960;          // logical design width
const VIEW_H = 540;          // logical design height
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / VIEW_W, wh / VIEW_H);
  const cw = Math.max(1, Math.round(VIEW_W * s));
  const ch = Math.max(1, Math.round(VIEW_H * s));
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  scale = canvas.width / VIEW_W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// ---------- Small helpers ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => Math.random() < p;
const sign = v => v < 0 ? -1 : (v > 0 ? 1 : 0);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const aabb = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

// ============================================================
// INPUT  (keyboard + touch)
// ============================================================
const Input = {
  left: false, right: false, jump: false, dash: false, phase: false,
  pause: false,
  jumpPressed: false, dashPressed: false, phasePressed: false,
  pausePressed: false, anyPressed: false,
  isTouch: false,
  _keys: {},

  bindKeyboard() {
    window.addEventListener('keydown', (e) => {
      const c = e.code;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(c) >= 0) e.preventDefault();
      if (c === 'KeyP' || c === 'Escape') e.preventDefault();
      if (this._keys[c]) return;      // ignore auto-repeat
      this._keys[c] = true;
      this.anyPressed = true;
      switch (c) {
        case 'ArrowLeft': case 'KeyA': this.left = true; break;
        case 'ArrowRight': case 'KeyD': this.right = true; break;
        case 'ArrowUp': case 'KeyW': case 'Space':
          this.jump = true; this.jumpPressed = true; break;
        case 'ShiftLeft': case 'ShiftRight': case 'KeyJ':
          this.dash = true; this.dashPressed = true; break;
        case 'KeyK':
          this.phase = true; this.phasePressed = true; break;
        case 'KeyP': case 'Escape':
          this.pause = true; this.pausePressed = true; break;
        case 'KeyM':
          if (typeof AudioSys !== 'undefined') AudioSys.toggleMute(); break;
      }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
      const c = e.code;
      this._keys[c] = false;
      switch (c) {
        case 'ArrowLeft': case 'KeyA': this.left = false; break;
        case 'ArrowRight': case 'KeyD': this.right = false; break;
        case 'ArrowUp': case 'KeyW': case 'Space': this.jump = false; break;
        case 'ShiftLeft': case 'ShiftRight': case 'KeyJ': this.dash = false; break;
        case 'KeyK': this.phase = false; break;
        case 'KeyP': case 'Escape': this.pause = false; break;
      }
    });

    window.addEventListener('blur', () => this.releaseAll());
    window.addEventListener('contextmenu', (e) => { if (e.target === canvas) e.preventDefault(); });
  },

  releaseAll() {
    this.left = this.right = this.jump = this.dash = this.phase = this.pause = false;
    this._keys = {};
    for (const el of document.querySelectorAll('.tbtn')) el.classList.remove('act');
  },

  bindTouch() {
    const touchEl = document.getElementById('touch');
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (!isTouchDevice) return;
    touchEl.classList.add('on');
    this.isTouch = true;

    const map = [
      ['tLeft', 'left'], ['tRight', 'right'],
      ['tJump', 'jump'], ['tDash', 'dash'], ['tPhase', 'phase']
    ];
    const active = new Map();   // pointerId -> action

    for (const [id, action] of map) {
      const el = document.getElementById(id);
      const press = (ev) => {
        ev.preventDefault();
        el.setPointerCapture && el.setPointerCapture(ev.pointerId);
        active.set(ev.pointerId, action);
        el.classList.add('act');
        this.isTouch = true;
        this.anyPressed = true;
        if (action === 'jump') { if (!this.jump) this.jumpPressed = true; this.jump = true; }
        else if (action === 'dash') { if (!this.dash) this.dashPressed = true; this.dash = true; }
        else if (action === 'phase') { if (!this.phase) this.phasePressed = true; this.phase = true; }
        else this[action] = true;
      };
      const release = (ev) => {
        const a = active.get(ev.pointerId);
        if (!a) return;
        active.delete(ev.pointerId);
        el.classList.remove('act');
        if (a === 'jump') this.jump = anyHeld('jump');
        else if (a === 'dash') this.dash = anyHeld('dash');
        else if (a === 'phase') this.phase = anyHeld('phase');
        else this[a] = anyHeld(a);
        function anyHeld(name) {
          for (const v of active.values()) if (v === name) return true;
          return false;
        }
      };
      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);
    }

    const pEl = document.getElementById('tPause');
    pEl.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      this.isTouch = true; this.anyPressed = true;
      this.pausePressed = true; this.pause = true;
      setTimeout(() => { this.pause = false; }, 60);
    });
  },

  // consume one-frame edge flags
  endFrame() {
    this.jumpPressed = false;
    this.dashPressed = false;
    this.phasePressed = false;
    this.pausePressed = false;
    this.anyPressed = false;
  }
};

// ============================================================
// AUDIO  (Web Audio API — created lazily on first gesture)
// ============================================================
const AudioSys = {
  ctx: null, master: null, muted: false, ready: false,
  lastStep: 0, lastBark: 0, comboPitch: 0,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.ready = true;
    } catch (err) { this.ready = false; }
  },

  resume() {
    if (this.ready && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    return this.muted;
  },

  _ok() { return this.ready && !this.muted && this.ctx.state === 'running'; },

  // simple tone with envelope
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this._ok()) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },

  // filtered noise burst
  noise(dur, vol, freq, q, delay) {
    if (!this._ok()) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq || 900; f.Q.value = q || 1;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.1;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },

  meow(pitch) {
    if (!this._ok()) return;
    const p = pitch || 1;
    this.tone(520 * p, 0.16, 'sawtooth', 0.10, 780 * p);
    this.tone(780 * p, 0.20, 'triangle', 0.09, 430 * p, 0.14);
  },
  sadMeow() {
    if (!this._ok()) return;
    this.tone(420, 0.25, 'sawtooth', 0.11, 180);
    this.tone(300, 0.3, 'triangle', 0.09, 120, 0.18);
  },
  bark(big) {
    const now = performance.now();
    if (now - this.lastBark < 220) return;
    this.lastBark = now;
    if (!this._ok()) return;
    const f = big ? 180 : 300;
    this.tone(f, 0.09, 'square', 0.13, f * 0.55);
    this.tone(f * 1.4, 0.07, 'square', 0.08, f * 0.7, 0.07);
    this.noise(0.08, 0.06, 700, 2);
  },
  jump(second) {
    if (!this._ok()) return;
    const b = second ? 480 : 380;
    this.tone(b, 0.12, 'square', 0.10, b * 1.9);
    this.noise(0.05, 0.04, 1600, 1.5);
  },
  land() { this.noise(0.07, 0.07, 420, 1.2); },
  step() {
    const now = performance.now();
    if (now - this.lastStep < 130) return;
    this.lastStep = now;
    this.noise(0.04, 0.035, 1300, 2.2);
  },
  dash() {
    if (!this._ok()) return;
    this.noise(0.18, 0.09, 2400, 0.8);
    this.tone(220, 0.16, 'sawtooth', 0.07, 700);
  },
  chime(rare) {
    if (!this._ok()) return;
    const base = rare ? 880 : 660;
    this.tone(base, 0.14, 'triangle', 0.10, base * 1.5);
    this.tone(base * 1.5, 0.18, 'triangle', 0.09, base * 2, 0.09);
    if (rare) this.tone(base * 2, 0.25, 'sine', 0.08, base * 3, 0.19);
  },
  combo(level) {
    if (!this._ok()) return;
    const f = 500 + Math.min(level, 8) * 90;
    this.tone(f, 0.09, 'square', 0.09, f * 1.35);
    this.tone(f * 1.5, 0.1, 'square', 0.07, f * 2, 0.07);
  },
  narrowEscape() {
    if (!this._ok()) return;
    this.tone(700, 0.08, 'square', 0.10, 1400);
    this.tone(1400, 0.12, 'square', 0.08, 900, 0.08);
    this.noise(0.1, 0.05, 3000, 1);
  },
  phaseSwitch(toMoon) {
    if (!this._ok()) return;
    if (toMoon) this.tone(500, 0.22, 'sine', 0.10, 1000);
    else this.tone(1000, 0.22, 'sine', 0.10, 500);
    this.noise(0.14, 0.05, 2600, 1.4);
  },
  caught() {
    if (!this._ok()) return;
    this.tone(400, 0.12, 'square', 0.12, 160);
    this.noise(0.3, 0.1, 500, 0.7);
    this.tone(160, 0.3, 'sawtooth', 0.09, 70, 0.1);
  },
  uiClick() { this.tone(660, 0.06, 'square', 0.07, 880); }
};

// ============================================================
// PARTICLES / FX  (capped arrays — no leaks)
// ============================================================
const MAX_PARTICLES = 320;
const MAX_POPUPS = 24;
const MAX_SHAKES = 1;   // single shake state with decay

const FX = {
  parts: [],
  popups: [],
  shakeT: 0, shakeDur: 0, shakeMag: 0,
  flashT: 0, flashDur: 0, flashColor: '255,255,255',

  clear() { this.parts.length = 0; this.popups.length = 0; this.shakeT = 0; this.flashT = 0; },

  spawn(o) {
    if (this.parts.length >= MAX_PARTICLES) this.parts.shift();
    this.parts.push({
      x: o.x, y: o.y,
      vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 0.5, max: o.life || 0.5,
      size: o.size || 4,
      color: o.color || '#ffffff',
      grav: o.grav !== undefined ? o.grav : 0,
      drag: o.drag !== undefined ? o.drag : 1,
      kind: o.kind || 'dot',       // dot | fur | spark | ring | print | puff
      rot: o.rot || 0, vr: o.vr || 0,
      alpha: o.alpha !== undefined ? o.alpha : 1
    });
  },

  burst(x, y, n, opt) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand((opt && opt.spMin) || 30, (opt && opt.spMax) || 120);
      this.spawn({
        x: x + rand(-4, 4), y: y + rand(-4, 4),
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opt && opt.up || 0),
        life: rand(0.3, 0.7), size: rand(2, 5),
        color: (opt && opt.color) || '#fff',
        grav: (opt && opt.grav) !== undefined ? opt.grav : 180,
        kind: (opt && opt.kind) || 'dot'
      });
    }
  },

  dust(x, y, dir) {
    for (let i = 0; i < 6; i++) {
      this.spawn({
        x: x + rand(-8, 8), y: y + rand(-3, 2),
        vx: rand(-40, 40) - dir * 30, vy: rand(-60, -10),
        life: rand(0.25, 0.5), size: rand(3, 7),
        color: 'rgba(255,244,214,0.85)', grav: -20, drag: 0.94, kind: 'puff'
      });
    }
  },

  fur(x, y, color) {
    for (let i = 0; i < 4; i++) {
      this.spawn({
        x: x + rand(-6, 6), y: y + rand(-6, 6),
        vx: rand(-70, 70), vy: rand(-90, -10),
        life: rand(0.4, 0.9), size: rand(2, 4),
        color: color || '#ffd27f', grav: 60, drag: 0.97, kind: 'fur', vr: rand(-6, 6)
      });
    }
  },

  pawPrint(x, y, glow, flip) {
    this.spawn({
      x, y, vx: 0, vy: 0, life: 0.7, size: 7,
      color: glow ? (Math.random() < 0.5 ? '#ffe66d' : '#8affea') : 'rgba(255,255,255,0.5)',
      grav: 0, kind: 'print', rot: flip ? Math.PI : 0, alpha: glow ? 1 : 0.7
    });
  },

  sparkle(x, y, colors) {
    this.spawn({
      x, y, vx: rand(-30, 30), vy: rand(-60, 10),
      life: rand(0.4, 0.8), size: rand(3, 6),
      color: colors[(Math.random() * colors.length) | 0],
      grav: 30, kind: 'spark', rot: rand(0, 6.28), vr: rand(-4, 4)
    });
  },

  popup(x, y, text, color, big) {
    if (this.popups.length >= MAX_POPUPS) this.popups.shift();
    this.popups.push({ x, y, text, color: color || '#fff', life: 1.1, max: 1.1, big: !!big, vy: -46 });
  },

  shake(mag, dur) {
    if (mag >= this.shakeMag || this.shakeT <= 0) { this.shakeMag = mag; this.shakeDur = dur; this.shakeT = dur; }
  },
  flash(dur, color) { this.flashDur = dur; this.flashT = dur; this.flashColor = color || '255,255,255'; },

  update(dt) {
    const p = this.parts;
    for (let i = p.length - 1; i >= 0; i--) {
      const q = p[i];
      q.life -= dt;
      if (q.life <= 0) { p.splice(i, 1); continue; }
      q.vy += q.grav * dt;
      q.vx *= Math.pow(q.drag, dt * 60);
      q.vy *= Math.pow(q.drag, dt * 60);
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.rot += q.vr * dt;
    }
    const u = this.popups;
    for (let i = u.length - 1; i >= 0; i--) {
      const q = u[i];
      q.life -= dt; q.y += q.vy * dt; q.vy *= Math.pow(0.9, dt * 60);
      if (q.life <= 0) u.splice(i, 1);
    }
    if (this.shakeT > 0) this.shakeT -= dt;
    if (this.flashT > 0) this.flashT -= dt;
  },

  shakeOffset() {
    if (this.shakeT <= 0) return { x: 0, y: 0 };
    const k = this.shakeT / Math.max(0.001, this.shakeDur);
    const m = this.shakeMag * k;
    return { x: rand(-m, m), y: rand(-m, m) };
  }
};

// ============================================================
// GAME STATE MACHINE  &  REALMS
// ============================================================
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };

const REALM = {
  SUN: 0, MOON: 1,
  name(r) { return r === 0 ? 'Reino de la Luz' : 'Reino de la Luna'; },
  skyTop(r) { return r === 0 ? '#7ed6ff' : '#1b1b46'; },
  skyBot(r) { return r === 0 ? '#ffe9a8' : '#4b2f7a'; }
};

const Game = {
  state: STATE.MENU,
  time: 0,
  realm: REALM.SUN,
  realmSwitchCd: 0,      // small cooldown so K spam is not chaotic
  realmGhost: 0,         // ghost silhouette timer after switch
  score: 0,
  best: 0,
  combo: 0,
  comboTimer: 0,
  distance: 0,
  dogsDodged:0,
  fishCaught: 0,
  treats: 0,             // golosinas (bells) earned this run
  speed: 1,              // difficulty scalar
  caughtT: 0,            // timer during catch animation
  message: '', messageT: 0, messageKey: '',
  camX: 0,
  deaths: 0,             // for adaptive difficulty (persistent per page)
  runs: 0,
  cosmetic: { tint: null, hat: false, collar: false },

  reset() {
    this.state = STATE.PLAYING;
    this.time = 0;
    this.score = 0;
    this.combo = 0; this.comboTimer = 0;
    this.distance = 0;
    this.dogsDodged = 0;
    this.fishCaught = 0;
    this.treats = 0;
    this.speed = 1;
    this.caughtT = 0;
    this.camX = 0;
    this.realmGhost = 0;
    this.realmSwitchCd = 0;
    this.runs++;
    this.setMessage('¡Corre, Michi, corre!', 2.2);
    FX.clear();
    WORLD.reset();
    Kitten.respawn();
    DogMgr.reset();
    Collect.reset();
    if (typeof App !== 'undefined') { App.overT = 0; App.restartReq = false; }
    Kitten.happyT = 0;
  },

  setMessage(text, dur, key) {
    if (key && key === this.messageKey && this.messageT > 0.4) return;
    this.message = text; this.messageT = dur || 2; this.messageKey = key || text;
  },

  addScore(base, x, y, label, big) {
    const mult = 1 + Math.min(this.combo, 10) * 0.25;
    const add = Math.round(base * mult);
    this.score += add;
    if (label) FX.popup(x, y, label + ' +' + add, big ? '#ffe66d' : '#ffffff', big);
    return add;
  },

  switchRealm() {
    if (this.realmSwitchCd > 0 || this.state !== STATE.PLAYING) return;
    this.realm = this.realm === REALM.SUN ? REALM.MOON : REALM.SUN;
    this.realmSwitchCd = 0.35;
    this.realmGhost = 0.4;
    AudioSys.phaseSwitch(this.realm === REALM.MOON);
    FX.flash(0.18, this.realm === REALM.MOON ? '150,140,255' : '255,230,140');
    const cols = this.realm === REALM.MOON ? ['#9d8cff', '#6bf0c2', '#ffffff'] : ['#ffe66d', '#ff9f68', '#ffffff'];
    for (let i = 0; i < 16; i++) FX.sparkle(Kitten.x + rand(-40, 40), Kitten.y + rand(-50, 30), cols);
    this.setMessage(this.realm === REALM.MOON ? 'Reino de la Luna' : 'Reino de la Luz', 1.4, 'realm');
  },

  onDogDodged(x, y) {
    this.dogsDodged++;
    this.combo++;
    this.comboTimer = 3.0;
    Kitten.happyT = 1.8;
    AudioSys.combo(this.combo);
    const bonus = 25 * Math.min(this.combo, 10);
    this.score += bonus;
    FX.popup(x, y - 30, 'x' + this.combo + ' ¡Esquivo! +' + bonus, '#8affea', this.combo >= 3);
    FX.burst(x, y, 8, { color: '#8affea', kind: 'spark' });
    if (this.combo >= 2) FX.shake(3, 0.15);
    if (this.combo >= 5 && this.combo % 5 === 0) {
      this.setMessage('¡Salto gatuno perfecto!', 1.6, 'perfect' + this.combo);
      FX.flash(0.12, '180,255,220');
    }
  },

  narrowEscape() {
    AudioSys.narrowEscape();
    FX.shake(7, 0.35);
    FX.flash(0.16, '255,255,255');
    this.setMessage('¡Por poquito, Michi!', 1.6, 'narrow' + Math.floor(this.time));
    this.score += 40;
  },

  tick(dt) {
    if (this.messageT > 0) this.messageT -= dt;
    if (this.realmSwitchCd > 0) this.realmSwitchCd -= dt;
    if (this.realmGhost > 0) this.realmGhost -= dt;
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0 && this.combo > 0) {
        if (this.combo >= 4) this.setMessage('Combo perdido... ¡sigue corriendo!', 1.2, 'comboLost');
        this.combo = 0;
      }
    }
    this.speed = 1 + Math.min(1.1, this.distance / 9000);
  }
};

// ============================================================
// WORLD / LEVEL GENERATOR  (endless, procedural, adaptive)
// ============================================================
const GROUND_Y = 470;          // baseline top-of-ground in world space
const WORLD = {
  plats: [],          // solid rects: {x,y,w,h,r,type}
  deco: [],           // background/foreground decor {x,y,kind,scale,layer}
  seedX: 0,
  lastGapEnd: 0,
  safeStreak: 0,
  difficulty: 0,      // 0..1 grows with distance
  gapCount: 0,

  reset() {
    this.plats.length = 0;
    this.deco.length = 0;
    this.seedX = -200;
    this.lastGapEnd = -200;
    this.safeStreak = 0;
    this.difficulty = 0;
    this.gapCount = 0;
    // starting safe runway
    this.pushPlatform(-200, GROUND_Y, 900, 200, 2, 'ground');
    this.seedX = 700;
    this.ensureAhead(1800);
  },

  pushPlatform(x, y, w, h, r, type) {
    const p = { x, y, w, h, r, type };
    this.plats.push(p);
    return p;
  },

  // realm mask: 0 = sun only, 1 = moon only, 2 = both
  platformVisible(p) { return p.r === 2 || p.r === Game.realm; },

  ensureAhead(amount) {
    const limit = (typeof Kitten !== 'undefined' ? Kitten.x : 0) + amount;
    let guard = 0;
    while (this.seedX < limit && guard++ < 60) this.generateChunk();
    // cull far-behind content
    const cull = (typeof Game !== 'undefined' ? Game.camX : 0) - 900;
    if (this.plats.length > 90) {
      for (let i = this.plats.length - 1; i >= 0; i--) {
        const p = this.plats[i];
        if (p.x + p.w < cull && p.x > -600) this.plats.splice(i, 1);
      }
    }
    if (this.deco.length > 220) {
      for (let i = this.deco.length - 1; i >= 0; i--) {
        if (this.deco[i].x < cull - 1400) this.deco.splice(i, 1);
      }
    }
  },

  // ---- adaptive difficulty knobs ----
  gapWidth() {
    // dying often => wider gaps become *narrower*; doing well => slightly wider
    const deathRelief = Math.min(0.35, Game.deaths * 0.06);
    const base = lerp(70, 190, this.difficulty) * (1 - deathRelief);
    return rand(base * 0.7, base * 1.15);
  },

  generateChunk() {
    const d = this.difficulty;
    const startX = this.seedX;
    const groundLen = rand(lerp(280, 170, d), lerp(560, 300, d));

    // --- ground segment (always realm-shared -> fair switching) ---
    this.pushPlatform(startX, GROUND_Y, groundLen, 220, 2, 'ground');
    this.decorateGround(startX, groundLen);

    // --- hazards / elevated paths placed on this ground segment ---
    const roll = Math.random();
    const safeHere = chance(0.16 + (1 - d) * 0.14);   // occasional safe platform stretch

    if (safeHere) {
      this.buildSafeStretch(startX, groundLen);
    } else if (roll < 0.45) {
      this.buildObstacleRun(startX, groundLen, d);
    } else if (roll < 0.78) {
      this.buildElevatedPath(startX, groundLen, d);
    } else {
      this.buildHidingNook(startX, groundLen);
    }

    // --- gap to next ground (fair: width respects difficulty) ---
    const gapW = this.gapWidth();
    // safety net: never a gap right after a hard obstacle cluster
    if (this.safeStreak > 0 && chance(0.5)) {
      this.safeStreak--;
    }
    this.gapCount++;
    const nextX = startX + groundLen + gapW;
    this.lastGapEnd = nextX;

    // mid-gap rescue platform for wide gaps
    if (gapW > 150 && chance(0.55)) {
      const r = chance(0.5) ? 2 : randi(0, 1);   // sometimes realm-specific
      this.pushPlatform(startX + groundLen + gapW * 0.5 - 45, GROUND_Y - rand(30, 70), 90, 18, r, 'plat');
    }

    this.seedX = nextX;
    this.safeStreak = 0;
  },

  decorateGround(x, len) {
    // background decor along this segment — scenery only: never a kind that
    // mimics a jumpable solid (crate/fence), so "what can I stand on" stays unambiguous
    let dx = x;
    while (dx < x + len) {
      const kind = ['bush', 'lamp', 'house', 'bin', 'tree'][randi(0, 4)];
      this.deco.push({ x: dx, y: GROUND_Y, kind, scale: rand(0.8, 1.25), layer: 1 });
      dx += rand(150, 300);
    }
    this.deco.push({ x: x + len * 0.5, y: GROUND_Y, kind: chance(0.5) ? 'bird' : 'cloud', scale: rand(0.7, 1.2), layer: 0 });
  },

  buildObstacleRun(x, len, d) {
    const count = randi(1, Math.max(1, Math.round(1 + d * 2.6)));
    let cx = x + rand(60, 120);
    for (let i = 0; i < count; i++) {
      if (cx > x + len - 70) break;
      const kind = randi(0, 2);
      if (kind === 0) {              // crate (jump on/over)
        const h = rand(34, 58);
        this.pushPlatform(cx, GROUND_Y - h, rand(44, 58), h, 2, 'crate');
      } else if (kind === 1) {       // fence (thin, jump over)
        const h = 46;
        this.pushPlatform(cx, GROUND_Y - h, 20, h, 2, 'fence');
      } else {                        // low wall with planter
        const h = 26;
        this.pushPlatform(cx, GROUND_Y - h, rand(56, 74), h, 2, 'wall');
      }
      cx += rand(150, 240) * (1 - d * 0.3);
    }
  },

  buildElevatedPath(x, len, d) {
    // a run of floating platforms above the ground, one per realm mixed
    const n = randi(2, 4);
    let px = x + rand(30, 90);
    for (let i = 0; i < n; i++) {
      const r = chance(0.35) ? randi(0, 1) : 2;
      const y = GROUND_Y - rand(90, 155);
      const w = rand(90, 140);
      this.pushPlatform(px, y, w, 18, r, 'plat');
      if (chance(0.5)) this.deco.push({ x: px + w * 0.5, y: y - 14, kind: 'plant', scale: 1, layer: 2 });
      px += w + rand(50, 110) * (1 - d * 0.25);
    }
    // keep some ground obstacles below to force choice
    if (chance(0.6)) this.buildObstacleRun(x + 40, len - 60, d * 0.6);
  },

  buildSafeStretch(x, len) {
    this.safeStreak = 1;
    // clean ground, a fish, maybe a low easy crate — breathing room
    if (chance(0.7)) Collect.trySpawnFish(x + len * 0.5, GROUND_Y - 60, 2);
    if (chance(0.45)) {
      const r = chance(0.5) ? 2 : randi(0, 1);
      this.pushPlatform(x + len * 0.3, GROUND_Y - 100, 130, 18, r, 'plat');
    }
  },

  buildHidingNook(x, len) {
    // stacked boxes forming a little alcove where the kitten can wait
    const bx = x + len * 0.5;
    this.pushPlatform(bx, GROUND_Y - 52, 52, 52, 2, 'crate');
    this.pushPlatform(bx + 54, GROUND_Y - 40, 46, 40, 2, 'crate');
    this.pushPlatform(bx - 40, GROUND_Y - 18, 38, 18, 2, 'wall');
    this.deco.push({ x: bx + 27, y: GROUND_Y - 60, kind: 'sign', scale: 1, layer: 2 });
    if (chance(0.6)) Collect.trySpawnFish(bx + 27, GROUND_Y - 96, 2);
  },

  // --- collision query: return platform the rect would stand on ---
  solidsNear(x, w) {
    const out = [];
    for (let i = 0; i < this.plats.length; i++) {
      const p = this.plats[i];
      if (p.x > x + w + 60 || p.x + p.w < x - 60) continue;
      if (this.platformVisible(p)) out.push(p);
    }
    return out;
  },

  update() {
    this.difficulty = clamp((Game.speed - 1) / 1.1, 0, 1);
    this.ensureAhead(VIEW_W * 2.2);
  }
};

// ============================================================
// PHYSICS CONSTANTS + KITTEN (player)
// ============================================================
const PH = {
  GRAV: 2250,
  MAX_FALL: 1180,
  RUN_SPEED: 268,
  ACCEL: 2100,
  FRICTION: 2500,
  AIR_ACCEL: 1500,
  JUMP_V: -740,
  JUMP_CUT: 0.42,       // variable jump height factor
  COYOTE: 0.10,
  BUFFER: 0.13,
  DOUBLE_JUMP_V: -640,
  DASH_SPEED: 660,
  DASH_TIME: 0.17,
  DASH_CD: 0.65
};

const Kitten = {
  x: 0, y: 0, w: 36, h: 32,
  vx: 0, vy: 0,
  onGround: false, wasOnGround: false,
  coyote: 0, buffer: 0,
  jumpsUsed: 0, maxJumps: 2,
  dashT: 0, dashCd: 0, dashDir: 1,
  face: 1,                 // 1 right, -1 left
  pose: 'run',             // run | jump | fall | land | catch | stretch
  animT: 0, landT: 0,
  tailT: 0, whiskerT: 0,
  caught: false, caughtT: 0,
  scared: false, happyT: 0,
  runCycle: 0, blinkT: 2,
  stepTimer: 0,

  respawn() {
    this.x = 120; this.y = GROUND_Y - this.h;
    this.vx = 0; this.vy = 0;
    this.onGround = true; this.wasOnGround = true;
    this.coyote = 0; this.buffer = 0; this.jumpsUsed = 0;
    this.dashT = 0; this.dashCd = 0; this.face = 1;
    this.pose = 'land'; this.landT = 0.12;
    this.caught = false; this.caughtT = 0;
    this.scared = false; this.happyT = 0;
    this.runCycle = 0; this.tailT = 0;
  },

  get cx() { return this.x + this.w / 2; },
  get cy() { return this.y + this.h / 2; },

  update(dt, dtReal) {
    this.animT += dt;
    this.tailT += dt;
    this.whiskerT += dt;
    if (this.happyT > 0) this.happyT -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.landT > 0) this.landT -= dt;
    this.blinkT -= dt;
    if (this.blinkT <= 0) this.blinkT = rand(1.6, 4.2);

    if (this.caught) {
      // catch animation always runs in real time (0.2-0.5s)
      this.updateCaught(dtReal !== undefined ? dtReal : dt);
      return;
    }

    const dtu = dt;   // physics timestep in seconds

    // ---------- horizontal intent ----------
    let dir = 0;
    if (Input.left) dir -= 1;
    if (Input.right) dir += 1;
    if (dir !== 0) this.face = dir;

    // ---------- dash ----------
    if (Input.dashPressed && this.dashT <= 0 && this.dashCd <= 0) {
      this.dashT = PH.DASH_TIME;
      this.dashCd = PH.DASH_CD;
      this.dashDir = dir !== 0 ? dir : this.face;
      AudioSys.dash();
      FX.fur(this.cx, this.cy, Game.cosmetic.tint || '#ffce7a');
      FX.burst(this.cx, this.cy, 6, { color: '#ffd6e0', kind: 'fur', spMax: 90, grav: 40 });
      FX.shake(3, 0.12);
    }

    if (this.dashT > 0) {
      this.dashT -= dtu;
      this.vx = this.dashDir * PH.DASH_SPEED;
      this.pose = 'stretch';
      if (Math.random() < 0.6) FX.fur(this.cx - this.dashDir * 12, this.cy + rand(-8, 8), Game.cosmetic.tint || '#ffce7a');
    } else {
      const target = dir * PH.RUN_SPEED * (Game.yarnBoost > 0 ? 1.35 : 1);
      const acc = this.onGround ? PH.ACCEL : PH.AIR_ACCEL;
      if (dir !== 0) {
        if (this.vx < target) this.vx = Math.min(target, this.vx + acc * dtu);
        else if (this.vx > target) this.vx = Math.max(target, this.vx - acc * dtu);
      } else {
        const f = (this.onGround ? PH.FRICTION : PH.FRICTION * 0.35) * dtu;
        if (Math.abs(this.vx) <= f) this.vx = 0; else this.vx -= sign(this.vx) * f;
      }
    }

    // ---------- jumping: coyote + buffer + variable + double ----------
    if (this.onGround) { this.coyote = PH.COYOTE; this.jumpsUsed = 0; }
    else if (this.coyote > 0) this.coyote -= dtu;
    else if (this.jumpsUsed < 1) this.jumpsUsed = 1;   // ground jump lost -> one air jump remains
    if (Input.jumpPressed) this.buffer = PH.BUFFER;
    else if (this.buffer > 0) this.buffer -= dtu;

    const canJump = (this.coyote > 0 && this.jumpsUsed < this.maxJumps) ||
                    (this.jumpsUsed > 0 && this.jumpsUsed < this.maxJumps);
    if (this.buffer > 0 && canJump) {
      const second = this.jumpsUsed > 0 && this.coyote <= 0;
      this.jumpsUsed++;
      this.vy = second ? PH.DOUBLE_JUMP_V : PH.JUMP_V;
      this.buffer = 0; this.coyote = 0;
      this.onGround = false;
      AudioSys.jump(second);
      if (second) {
        FX.burst(this.cx, this.y + this.h, 7, { color: '#ffffff', kind: 'spark', spMax: 110, grav: 60 });
        this.setMessageSafe('¡Doble salto gatuno!', 'dj');
      } else {
        Game.combo++;
        Game.comboTimer = Math.max(Game.comboTimer, 2.4);
        if (Game.combo >= 3) {
          FX.popup(this.cx, this.y - 16, 'x' + Game.combo, '#ffe66d', Game.combo >= 5);
        }
      }
      this.pose = 'jump';
    }
    // variable height: releasing jump early adds extra fall (smooth short hop)
    if (!Input.jump && this.vy < 0) this.vy += PH.GRAV * 1.7 * dtu;

    // ---------- gravity ----------
    if (this.dashT <= 0) {
      this.vy += PH.GRAV * dtu;
      if (this.vy > PH.MAX_FALL) this.vy = PH.MAX_FALL;
    } else {
      this.vy *= Math.pow(0.02, dtu * 60);   // dash holds vertical drift
    }

    // ---------- integrate + collide ----------
    this.wasOnGround = this.onGround;
    this.moveX(this.vx * dtu);
    this.moveY(this.vy * dtu);

    // ---------- pose selection ----------
    if (this.onGround) {
      if (!this.wasOnGround) { this.land(); }
      if (this.landT > 0) this.pose = 'land';
      else if (Math.abs(this.vx) > 24) this.pose = 'run';
      else this.pose = 'idle';
      this.runCycle += Math.abs(this.vx) * dtu * 0.055;
      this.stepTimer -= dtu;
      if (this.stepTimer <= 0 && Math.abs(this.vx) > 60) {
        this.stepTimer = 0.19;
        AudioSys.step();
        FX.pawPrint(this.cx - sign(this.vx) * 10, this.y + this.h - 1, Game.realm === REALM.MOON, sign(this.vx) < 0);
      }
    } else {
      this.pose = this.vy < -40 ? 'jump' : (this.vy > 160 ? 'fall' : 'float');
    }

    // ---------- fell into a pit ----------
    if (this.y > VIEW_H + 220) this.getCaught('pit');
  },

  setMessageSafe(text, key) {
    if (key) Game.setMessage(text, 1.4, key + Math.floor(Game.time / 3));
    else Game.setMessage(text, 1.4);
  },

  land() {
    this.landT = 0.14;
    AudioSys.land();
    FX.dust(this.cx, this.y + this.h, sign(this.vx));
  },

  moveX(dx) {
    if (dx === 0) return;
    this.x += dx;
    const solids = WORLD.solidsNear(this.x, this.w);
    for (const p of solids) {
      if (this.y + this.h <= p.y + 2 || this.y >= p.y + p.h - 2) continue;
      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (dx > 0) { this.x = p.x - this.w; }
        else { this.x = p.x + p.w; }
        this.vx = 0;
      }
    }
    if (this.x < 0) { this.x = 0; if (this.vx < 0) this.vx = 0; }
  },

  moveY(dy) {
    this.y += dy;
    this.onGround = false;
    const solids = WORLD.solidsNear(this.x, this.w);
    let bestTop = Infinity;
    for (const p of solids) {
      if (this.x + this.w <= p.x + 1 || this.x >= p.x + p.w - 1) continue;
      if (this.y + this.h > p.y && this.y < p.y + p.h) {
        if (dy >= 0) {
          // landing on top
          if (p.y < bestTop && this.y + this.h - dy <= p.y + 6) {
            bestTop = p.y;
          }
        } else {
          // head bump
          if (this.y >= p.y + p.h - 8) { this.y = p.y + p.h; this.vy = 0; }
        }
      }
    }
    if (bestTop < Infinity) {
      this.y = bestTop - this.h;
      if (this.vy > 0) this.vy = 0;
      this.onGround = true;
    }
  },

  getCaught(cause) {
    if (this.caught || Game.state !== STATE.PLAYING) return;
    this.caught = true;
    this.caughtT = cause === 'pit' ? 0.34 : 0.45;
    this.pose = 'catch';
    this.vx = sign(this.face) * -30;
    this.vy = -250;               // scooped up into the dust cloud (no gore)
    AudioSys.caught();
    AudioSys.sadMeow();
    FX.shake(9, 0.4);
    FX.flash(0.2, '255,120,120');
    FX.dust(this.cx, this.y + this.h, 0);
    FX.burst(this.cx, this.cy, 14, { color: '#ffe8d6', kind: 'puff', spMax: 140, grav: 30 });
    FX.burst(this.cx, this.cy, 8, { color: '#ffd27f', kind: 'fur', spMax: 120, grav: 80 });
    Game.setMessage('¡Ese perro viene detrás de ti!', 1.4, 'caughtmsg');
  },

  updateCaught(dt) {
    this.caughtT -= dt;
    this.vy += PH.GRAV * 0.4 * dt;
    this.y += this.vy * dt;
    this.vx *= Math.pow(0.9, dt * 60);
    this.x += this.vx * dt;
    if (this.caughtT <= 0) Game.onCaughtEnd();
  }
};

// ============================================================
// COLLECTIBLES  (fish, sardine, yarn, golden bell)
// ============================================================
Game.yarnBoost = 0;

const Collect = {
  items: [],        // {x,y,w,h,type,t,r,bob,vy,got}
  spawnCursor: 0,
  MAX: 40,

  reset() {
    this.items.length = 0;
    this.spawnCursor = (typeof Kitten !== 'undefined' ? Kitten.x : 0) + 300;
  },

  trySpawnFish(x, y, r) {
    this.push('fish', x, y, r);
  },

  push(type, x, y, r) {
    if (this.items.length >= this.MAX) return;
    const size = type === 'bell' ? 26 : (type === 'yarn' ? 28 : 30);
    this.items.push({
      x, y, w: size, h: size, type,
      r: r !== undefined ? r : 2,
      t: rand(0, 6.28), bob: rand(1.5, 3.2),
      spin: rand(-2, 2), got: false, pop: 0
    });
  },

  ensureAhead() {
    const ahead = Kitten.x + VIEW_W * 1.6;
    let guard = 0;
    while (this.spawnCursor < ahead && guard++ < 30) this.spawnAt(this.spawnCursor), this.spawnCursor += rand(240, 460);
    const cull = Game.camX - 400;
    for (let i = this.items.length - 1; i >= 0; i--) {
      if (this.items[i].x < cull) this.items.splice(i, 1);
    }
  },

  spawnAt(x) {
    const d = WORLD.difficulty;
    const roll = Math.random();
    const r = chance(0.4) ? 2 : randi(0, 1);

    if (roll < 0.045) {                       // golden bell — rare
      this.push('bell', x, GROUND_Y - rand(90, 150), r);
      return;
    }
    if (roll < 0.16) {                        // yarn ball — speed boost
      this.push('yarn', x, GROUND_Y - rand(40, 90), r);
      return;
    }
    if (roll < 0.30) {                        // sardine — bigger reward
      this.push('sardine', x, GROUND_Y - rand(30, 70), r);
      return;
    }
    // fish line: a little arc the kitten sweeps through while jumping
    const n = randi(2, 4);
    const baseY = GROUND_Y - rand(50, 120);
    for (let i = 0; i < n; i++) {
      const arc = Math.sin((i + 1) / (n + 1) * Math.PI) * 44;
      this.push('fish', x + i * 58, baseY - arc, r);
    }
    if (d > 0.4 && chance(0.25)) this.push('fish', x + n * 58 + 40, GROUND_Y - rand(30, 60), r);
  },

  visible(it) { return it.r === 2 || it.r === Game.realm; },

  update(dt) {
    if (Game.yarnBoost > 0) Game.yarnBoost -= dt;
    this.ensureAhead();
    const k = Kitten;
    const kcx = k.cx, kcy = k.cy;
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.t += dt * it.bob;
      if (it.got) {
        it.pop -= dt;
        it.y -= 60 * dt;
        if (it.pop <= 0) this.items.splice(i, 1);
        continue;
      }
      if (!this.visible(it)) continue;
      // pick-up test (generous AABB)
      const dx = Math.abs(kcx - (it.x + it.w / 2));
      const dy = Math.abs(kcy - (it.y + it.h / 2));
      if (dx < it.w / 2 + k.w / 2 - 2 && dy < it.h / 2 + k.h / 2 + 4) this.collect(it, i);
    }
  },

  collect(it, idx) {
    it.got = true;
    it.pop = 0.35;
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    switch (it.type) {
      case 'fish':
        Game.fishCaught++;
        Game.addScore(50, cx, cy, '¡Pescadito conseguido!', false);
        AudioSys.chime(false);
        FX.burst(cx, cy, 8, { color: '#7fe9ff', kind: 'spark', spMax: 120, grav: 60 });
        if (Game.fishCaught % 6 === 0) Game.setMessage('¡Pescadito conseguido!', 1.3, 'fish6');
        break;
      case 'sardine':
        Game.fishCaught++;
        Game.addScore(90, cx, cy, 'Sardina dorada', false);
        AudioSys.chime(false);
        FX.burst(cx, cy, 12, { color: '#ffe66d', kind: 'spark', spMax: 150, grav: 50 });
        break;
      case 'yarn':
        Game.yarnBoost = 4.0;
        Game.addScore(60, cx, cy, '¡Pelota de lana!', false);
        AudioSys.tone(300, 0.18, 'triangle', 0.10, 900);
        Game.setMessage('¡Pelota de lana! ¡Más rápido!', 1.5, 'yarn');
        FX.burst(cx, cy, 14, { color: '#ff8ad8', kind: 'dot', spMax: 130, grav: 90 });
        FX.shake(2, 0.1);
        break;
      case 'bell':
        Game.treats++;
        Game.addScore(300, cx, cy, '¡Campana dorada!', true);
        AudioSys.chime(true);
        FX.flash(0.2, '255,235,150');
        FX.shake(4, 0.2);
        for (let i = 0; i < 18; i++) FX.sparkle(cx, cy, ['#ffe66d', '#fff3b0', '#ffb347']);
        Shop.onBellEarned();
        Game.setMessage(Shop.lastUnlockMsg || '¡Campana dorada!', 2.2, 'bell' + Game.treats);
        break;
    }
  },

  draw(g, camX) {
    for (const it of this.items) {
      const sx = it.x - camX;
      if (sx < -60 || sx > VIEW_W + 60) continue;
      const bobY = Math.sin(it.t) * 4;
      const dim = !this.visible(it);
      g.save();
      g.globalAlpha = dim ? 0.3 : 1;
      g.translate(sx + it.w / 2, it.y + it.h / 2 + bobY);
      if (dim) g.scale(1, 1);
      const glow = it.got ? it.pop * 3 : 0;
      if (glow > 0) {
        g.globalAlpha = clamp(it.pop * 3, 0, 1);
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(0, 0, 20 + (0.35 - it.pop) * 60, 0, 6.29); g.fill();
        g.restore(); continue;
      }
      // prize halo: pickups read as rewards, never as street furniture
      const tint = (it.type === 'bell' || it.type === 'sardine') ? '255,214,90'
        : it.type === 'yarn' ? '255,140,208' : '150,225,255';
      const hg = g.createRadialGradient(0, 0, 3, 0, 0, 27);
      hg.addColorStop(0, 'rgba(' + tint + ',0.5)');
      hg.addColorStop(1, 'rgba(' + tint + ',0)');
      g.fillStyle = hg;
      g.beginPath(); g.arc(0, 0, 27, 0, 6.29); g.fill();
      drawItemSprite(g, it);
      g.restore();
    }
  }
};

// --- collectible sprites (procedural) ---
function drawItemSprite(g, it) {
  const t = it.type;
  if (t === 'fish' || t === 'sardine') {
    const big = t === 'sardine';
    g.rotate(Math.sin(it.t * 0.6) * 0.15);
    g.fillStyle = big ? '#ffd257' : '#7fd6ff';
    g.beginPath(); g.ellipse(0, 0, big ? 15 : 13, big ? 8 : 7, 0, 0, 6.29); g.fill();
    g.fillStyle = big ? '#ffb824' : '#4fb8e8';
    g.beginPath(); g.moveTo(-10, 0); g.lineTo(-19, -7); g.lineTo(-19, 7); g.closePath(); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(7, -2, 3, 0, 6.29); g.fill();
    g.fillStyle = '#12203a'; g.beginPath(); g.arc(8, -2, 1.5, 0, 6.29); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-4, -4); g.lineTo(4, -4); g.stroke();
    if (big) {
      g.fillStyle = '#fff2c2';
      g.beginPath(); g.ellipse(-2, 2, 6, 3, 0.4, 0, 6.29); g.fill();
    }
  } else if (t === 'yarn') {
    g.rotate(it.t * 0.9);
    g.fillStyle = '#ff7ad0';
    g.beginPath(); g.arc(0, 0, 13, 0, 6.29); g.fill();
    g.strokeStyle = '#ffd0ec'; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 9, 0.4, 3.4); g.stroke();
    g.beginPath(); g.arc(2, 1, 6, 2.4, 5.6); g.stroke();
    g.beginPath(); g.arc(-3, -2, 11, 1.2, 4.4); g.stroke();
    g.strokeStyle = '#ff9edd'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(10, 8); g.quadraticCurveTo(20, 14, 26, 8); g.stroke();
  } else if (t === 'bell') {
    const w = Math.sin(it.t * 3) * 0.18;
    g.rotate(w);
    g.fillStyle = '#ffd23d';
    g.beginPath();
    g.moveTo(-11, 9);
    g.quadraticCurveTo(-11, -12, 0, -14);
    g.quadraticCurveTo(11, -12, 11, 9);
    g.closePath(); g.fill();
    g.fillStyle = '#ffb300';
    g.fillRect(-13, 7, 26, 5);
    g.beginPath(); g.arc(0, 14, 4, 0, 6.29); g.fill();
    g.fillStyle = '#fff6cf';
    g.beginPath(); g.ellipse(-4, -5, 3, 6, 0.3, 0, 6.29); g.fill();
    g.fillStyle = '#7a5300';
    g.fillRect(-3, -19, 6, 5);
    // sparkle
    g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2;
    const s = 16 + Math.sin(it.t * 4) * 3;
    g.beginPath(); g.moveTo(s, -s); g.lineTo(s + 5, -s - 5); g.stroke();
  }
}

  { id: 'hound', name: 'Sabueso de largo salto', w: 74, h: 56, speed: 138, chase: 168,

  { id: 'dachshund', name: 'Teckel sigiloso', w: 62, h: 30, speed: 176, chase: 205,

  { id: 'bulldog', name: 'Bulldog bramador', w: 70, h: 52, speed: 150, chase: 195,
