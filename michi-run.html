    color: '#f2e6da', color2: '#d9c8ba', leap: 1, telegraph: 0.42, score: 280, sneak: 0 }
];

const DogMgr = {
  dogs: [],
  cursor: 0,
  MAX: 7,

  reset() {
    this.dogs.length = 0;
    this.cursor = (typeof Kitten !== 'undefined' ? Kitten.x : 0) + 560;
  },

  pickBreed() {
    const d = WORLD.difficulty;
    const pool = [];
    const push = (i, weight) => { for (let k = 0; k < weight; k++) pool.push(i); };
    push(0, 3);                          // chihuahua everywhere
    push(2, d > 0.12 ? 3 : 1);           // dachshund sneaky
    push(1, d > 0.25 ? 2 : 0);           // hound
    push(3, d > 0.4 ? 2 : 0);            // bulldog
    push(4, d > 0.55 ? 2 : 0);           // poodle
    return BREEDS[pool[(Math.random() * pool.length) | 0]];
  },

  // find a support surface near x (top y) — avoids spawning over pits
  supportAt(x) {
    let best = null;
    for (const p of WORLD.plats) {
      if (p.type !== 'ground' && p.type !== 'crate' && p.type !== 'wall') continue;
      if (x >= p.x + 6 && x <= p.x + p.w - 6) {
        if (!best || p.y < best) best = p.y;
      }
    }
    return best;
  },

  trySpawn() {
    const aheadLimit = Kitten.x + VIEW_W * 1.05;
    let guard = 0;
    while (this.cursor < aheadLimit && guard++ < 24) {
      const sx = this.cursor + rand(120, 240);
      this.cursor += rand(420, 760) * (1 - WORLD.difficulty * 0.35);
      if (this.dogs.length >= this.MAX) break;
      this.spawnOne(sx);
    }
  },

  spawnOne(sx) {
    const b = this.pickBreed();
    const groundY = this.supportAt(sx);
    if (groundY === null) return;                 // fair: never over a pit
    // realm: dogs exist in one realm only (fair escape tool)
    const r = chance(0.62) ? 2 : randi(0, 1);
    const sneak = b.sneak && chance(0.55);
    const dog = {
      breed: b, x: sx, y: groundY - b.h, w: b.w, h: b.h,
      vx: 0, vy: 0, realm: r,
      state: sneak ? 'hide' : 'patrol',   // hide | patrol | chase | warn | leap | bark
      dir: -1, home: sx, range: rand(70, 130),
      t: rand(0, 6), warnT: 0, leapT: 0,
      onGround: true, cycle: rand(0, 10),
      dodged: false, escaped: false, nearT: 0,
      spawned: false, spawnT: sneak ? rand(0.35, 1.1) : 0,
      alpha: 0, barkCd: rand(0.5, 2),
      slipT: 0, jumpedFrom: 0
    };
    if (sneak) dog.x = sx;
    this.dogs.push(dog);
  },

  update(dt) {
    this.trySpawn();
    const k = Kitten;
    for (let i = this.dogs.length - 1; i >= 0; i--) {
      const d = this.dogs[i];
      d.t += dt; d.cycle += dt;
      if (d.alpha < 1 && d.state !== 'hide') d.alpha = Math.min(1, d.alpha + dt * 3);

      // same-realm interaction only
      const sameRealm = (d.realm === Game.realm) || d.realm === 2;
      const dist = k.cx - (d.x + d.w / 2);
      const adist = Math.abs(dist);
      const near = adist < 260 && k.y < d.y + d.h + 80 && k.y + k.h > d.y - 60;

      switch (d.state) {
        case 'hide': {
          d.spawnT -= dt;
          d.alpha = 0;
          if (d.spawnT <= 0) {
            d.state = 'bark'; d.warnT = 0.45; d.alpha = 1;
            AudioSys.bark(false);
            FX.dust(d.x + d.w / 2, d.y + d.h, 0);
            Game.setMessage('¡Ese perro viene detrás de ti!', 1.5, 'sneak' + i);
            FX.shake(3, 0.15);
          }
          break;
        }
        case 'patrol': {
          d.x += d.dir * d.breed.speed * 0.45 * dt;
          if (d.x < d.home - d.range) { d.dir = 1; }
          else if (d.x > d.home + d.range) { d.dir = -1; }
          if (near && sameRealm) { d.state = 'chase'; d.barkCd = 0.2; }
          d.barkCd -= dt;
          if (d.barkCd <= 0 && adist < 340 && sameRealm) {
            d.barkCd = rand(1.6, 3.2);
            d.state = 'bark'; d.warnT = 0.4;
            AudioSys.bark(d.breed.id === 'bulldog');
          }
          break;
        }
        case 'bark': {
          d.warnT -= dt;
          if (d.warnT <= 0) d.state = near && sameRealm ? 'chase' : 'patrol';
          break;
        }
        case 'chase': {
          if (!sameRealm) { d.state = 'patrol'; break; }
          const want = dist > 0 ? 1 : -1;
          d.dir = want;
          const sp = d.breed.chase * (0.85 + WORLD.difficulty * 0.3);
          // decide to leap over an upcoming gap/obstacle
          let blocked = false;
          if (d.onGround) {
            blocked = this.blockedAhead(d);
            const probeX = d.x + (d.dir > 0 ? d.w + 16 : -16);
            const sup = this.supportAt(probeX);
            if ((sup === null || blocked) && d.breed.leap && adist < 420) {
              d.state = 'warn'; d.warnT = d.breed.telegraph;
              AudioSys.bark(false);
            }
          }
          if (blocked && d.onGround && !d.breed.leap) {
            // can't pass the wall — cornered dog barks at it
            d.barkCd -= dt;
            if (d.barkCd <= 0) {
              d.barkCd = rand(1.1, 2.2);
              d.state = 'bark'; d.warnT = 0.5;
              AudioSys.bark(d.breed.id === 'bulldog');
            }
          } else {
            d.x += d.dir * sp * dt;
          }
          if (adist > 520 || k.caught) { d.state = 'patrol'; d.dodged = false; }
          this.physicsDog(d, dt);
          break;
        }
        case 'warn': {
          d.warnT -= dt;
          d.vx = 0;
          if (d.warnT <= 0) {
            d.state = 'leap'; d.leapT = 0;
            d.vy = -(560 + Math.random() * 90);
            d.vx = d.dir * (d.breed.speed * (d.breed.leap ? 2.4 : 1.9));
            AudioSys.bark(true);
            FX.dust(d.x + d.w / 2, d.y + d.h, d.dir);
          }
          break;
        }
        case 'leap': {
          d.leapT += dt;
          this.physicsDog(d, dt);
          if (d.onGround && d.leapT > 0.25) { d.state = sameRealm ? 'chase' : 'patrol'; d.vx = 0; }
          if (adist > 560) { d.state = 'patrol'; }
          break;
        }
      }

      // keep dogs near their home region (no infinite chasers across the map)
      if (d.x < d.home - 460 && d.state === 'patrol') d.dir = 1;
      if (d.x > d.home + 620 && d.state === 'patrol') { d.state = 'patrol'; d.dir = -1; }

      // ---------- catch test ----------
      if (!k.caught && Game.state === STATE.PLAYING && sameRealm && d.alpha > 0.5) {
        if (aabb(d.x + 4, d.y + 4, d.w - 8, d.h - 8, k.x + 3, k.y + 3, k.w - 6, k.h - 6)) {
          // dash = brief phase-through (fair escape tool)
          if (k.dashT <= 0) {
            k.getCaught('dog');
            continue;
          }
        } else if (adist < 46 && d.state === 'leap' && !d.escaped) {
          d.escaped = true;
          Game.narrowEscape();
        }
      }

      // ---------- dog dodged (score) ----------
      if (!d.dodged && k.x > d.x + d.w + 40 && d.state !== 'hide' && adist < 460 && !k.caught) {
        d.dodged = true;
        d.escaped = true;
        if (sameRealm) {
          Game.onDogDodged(d.x + d.w / 2, d.y);
          if (Game.dogsDodged === 3 || Game.dogsDodged === 8 || Game.dogsDodged === 15) {
            Game.setMessage('¡Ese perro viene detrás de ti!', 1.6, 'dodge' + Game.dogsDodged);
          }
        }
      }

      // cull
      if (d.x + d.w < Game.camX - 420 || d.x > Game.camX + VIEW_W * 2.4 || d.y > VIEW_H + 260) this.dogs.splice(i, 1);
    }
  },

  blockedAhead(d) {
    const px = d.dir > 0 ? d.x + d.w + 4 : d.x - 4;
    for (const p of WORLD.plats) {
      if (!WORLD.platformVisible(p)) continue;
      if (p.type === 'ground') continue;
      if (px > p.x && px < p.x + p.w && p.y < d.y + d.h - 6 && p.y + p.h > d.y + 6) return true;
    }
    return false;
  },

  physicsDog(d, dt) {
    d.vy += PH.GRAV * 0.92 * dt;
    if (d.vy > PH.MAX_FALL) d.vy = PH.MAX_FALL;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.onGround = false;
    // land on support surfaces only if same realm (realm platforms differ)
    const sup = this.supportAt(d.x + d.w / 2);
    if (sup !== null && d.y + d.h >= sup && d.y + d.h - d.vy * dt <= sup + 12 && d.vy >= 0) {
      d.y = sup - d.h; d.vy = 0; d.onGround = true;
      if (d.state === 'leap') { FX.dust(d.x + d.w / 2, sup, d.dir); }
    }
    // don't wander into pits while patrolling
    if (d.onGround && d.state === 'patrol') {
      const aheadX = d.x + (d.dir > 0 ? d.w + 6 : -6);
      if (this.supportAt(aheadX) === null) d.dir *= -1;
    }
  }
};

// ============================================================
// STORAGE  (localStorage best score + cosmetics) & SHOP
// ============================================================
const Store = {
  KEY: 'michi-run-v1',
  data: { best: 0, bestCombo: 0, totalFish: 0, totalBells: 0, hats: [], tints: [], collar: false, muted: false, deaths: 0 },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          for (const k in this.data) if (p[k] !== undefined) this.data[k] = p[k];
        }
      }
    } catch (e) { /* storage unavailable — keep defaults */ }
    this.data.best = this.data.best || 0;
    this.data.hats = Array.isArray(this.data.hats) ? this.data.hats : [];
    this.data.tints = Array.isArray(this.data.tints) ? this.data.tints : [];
    return this.data;
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
  }
};

const Shop = {
  lastUnlockMsg: '',
  // hat ids available from bells
  hats: [
    { id: 'none', label: 'Sin sombrero', cost: 0 },
    { id: 'party', label: 'Sombrero de fiesta', cost: 1 },
    { id: 'cap', label: 'Gorra de corredor', cost: 2 },
    { id: 'crown', label: 'Corona michi', cost: 3 },
    { id: 'bandana', label: 'Bandana ninja', cost: 4 }
  ],
  tints: [
    { id: '', label: 'Naranja clásico', cost: 0 },
    { id: 'gray', label: 'Gris urbano', cost: 1 },
    { id: 'white', label: 'Blanco nieve', cost: 2 },
    { id: 'black', label: 'Negro misterio', cost: 3 },
    { id: 'pink', label: 'Rosa neón', cost: 4 }
  ],

  hatCost(id) { const h = this.hats.find(x => x.id === id); return h ? h.cost : 99; },
  tintCost(id) { const t = this.tints.find(x => x.id === id); return t ? t.cost : 99; },
  ownsHat(id) { return id === 'none' || Store.data.hats.indexOf(id) >= 0; },
  ownsTint(id) { return id === '' || Store.data.tints.indexOf(id) >= 0; },
  ownsCollar() { return !!Store.data.collar; },

  buyHat(id) {
    if (this.ownsHat(id)) { Game.cosmetic.hat = id; Store.save(); AudioSys.uiClick(); return true; }
    if (Store.data.totalBells >= this.hatCost(id)) {
      Store.data.hats.push(id);
      Game.cosmetic.hat = id; Store.save();
      return true;
    }
    return false;
  },
  buyTint(id) {
    if (this.ownsTint(id)) { Game.cosmetic.tint = id || null; Store.save(); AudioSys.uiClick(); return true; }
    if (Store.data.totalBells >= this.tintCost(id)) {
      Store.data.tints.push(id);
      Game.cosmetic.tint = id || null; Store.save();
      return true;
    }
    return false;
  },
  buyCollar() {
    if (this.ownsCollar()) { Game.cosmetic.collar = true; Store.save(); return true; }
    if (Store.data.totalBells >= 2) { Store.data.collar = true; Game.cosmetic.collar = true; Store.save(); return true; }
    return false;
  },

  onBellEarned() {
    Store.data.totalBells++;
    Store.data.totalFish += 0;
    this.lastUnlockMsg = '¡Campana dorada! (' + Store.data.totalBells + ' para desbloquear)';
    // auto-unlock celebrations
    if (Store.data.totalBells === 1) this.lastUnlockMsg = '¡Golosina! Se desbloqueó: Sombrero de fiesta';
    if (Store.data.totalBells === 1 && !this.ownsHat('party')) Store.data.hats.push('party');
    if (Store.data.totalBells === 2 && !this.ownsTint('gray')) Store.data.tints.push('gray');
    if (Store.data.totalBells === 3 && !this.ownsCollar()) Store.data.collar = true;
    if (Store.data.totalBells === 4 && !this.ownsHat('cap')) Store.data.hats.push('cap');
    if (Store.data.totalBells === 5 && !this.ownsTint('white')) Store.data.tints.push('white');
    if (Store.data.totalBells === 6 && !this.ownsHat('crown')) Store.data.hats.push('crown');
    if (Store.data.totalBells === 8 && !this.ownsTint('pink')) Store.data.tints.push('pink');
    if (Store.data.totalBells === 10 && !this.ownsHat('bandana')) Store.data.hats.push('bandana');
    Store.save();
  }
};

// ============================================================
// RUN LIFECYCLE  (called from entities)
// ============================================================
Game.finalizeRun = function () {
  Store.data.best = Math.max(Store.data.best || 0, Game.score);
  Store.data.bestCombo = Math.max(Store.data.bestCombo || 0, Game.combo);
  Store.data.totalFish += Game.fishCaught;
  Store.data.deaths = (Store.data.deaths || 0) + 1;
  Game.deaths = Store.data.deaths;
  Game.best = Store.data.best;
  Store.save();
};

Game.onCaughtEnd = function () {
  if (Game.state === STATE.GAMEOVER) return;
  Game.finalizeRun();
  Kitten.caught = false;
  Game.state = STATE.GAMEOVER;
  Game.overT = 0;
  AudioSys.uiClick();
};

Game.restartNow = function () {
  Game.reset();
};

// ============================================================
// KITTEN RENDERER  (procedural canvas cat — never a cube)
// ============================================================
function tintColors() {
  const t = Game.cosmetic.tint;
  switch (t) {
    case 'gray':  return { main: '#9aa3b2', dark: '#6f7887', light: '#c7ced9' };
    case 'white': return { main: '#f4f1ea', dark: '#cfc9bd', light: '#ffffff' };
    case 'black': return { main: '#3c3f52', dark: '#25273a', light: '#5c607a' };
    case 'pink':  return { main: '#ff8fc4', dark: '#e0609d', light: '#ffc4e0' };
    default:      return { main: '#ffab52', dark: '#e07a2c', light: '#ffd9a3' };
  }
}

function earShape(g, x, y, s, flip, tilt) {
  const c = tintColors();
  g.save();
  g.translate(x, y);
  g.rotate(tilt * (flip ? -1 : 1));
  g.scale(flip ? -1 : 1, 1);
  g.fillStyle = c.main;
  g.beginPath();
  g.moveTo(-7 * s, 4 * s);
  g.lineTo(0, -13 * s);
  g.lineTo(7 * s, 4 * s);
  g.closePath(); g.fill();
  g.fillStyle = '#ff9db3';
  g.beginPath();
  g.moveTo(-3.6 * s, 3 * s);
  g.lineTo(0, -7.5 * s);
  g.lineTo(3.6 * s, 3 * s);
  g.closePath(); g.fill();
  g.restore();
}

function drawTail(g, poseT) {
  const c = tintColors();
  const flick = Math.sin(poseT * 3.1) * 0.35 + Math.sin(poseT * 7.3) * 0.1;
  const baseLift = (Kitten.pose === 'jump' || Kitten.pose === 'fall' || Kitten.pose === 'stretch') ? -1.1 : -0.6;
  g.save();
  g.translate(-15, -16);
  g.rotate(baseLift + flick * 0.5);
  g.strokeStyle = c.main;
  g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(0, 0);
  g.quadraticCurveTo(-14, -6 + flick * 6, -20, -18 + flick * 8);
  g.quadraticCurveTo(-23, -24 + flick * 6, -17, -26 + flick * 4);
  g.stroke();
  // stripes on tail
  g.strokeStyle = c.dark; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-13, -6 + flick * 6); g.lineTo(-16, -11 + flick * 6); g.stroke();
  g.beginPath(); g.moveTo(-18, -16 + flick * 7); g.lineTo(-21, -20 + flick * 6); g.stroke();
  // fluffy tip
  g.fillStyle = c.light;
  g.beginPath(); g.arc(-17, -26 + flick * 4, 4.5, 0, 6.29); g.fill();
  g.restore();
}

function drawLeg(g, x, y, len, swing, thick, pawUp) {
  const c = tintColors();
  g.save();
  g.translate(x, y);
  g.rotate(swing);
  g.strokeStyle = c.main;
  g.lineWidth = thick; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, len); g.stroke();
  // paw
  g.fillStyle = c.light;
  g.beginPath(); g.ellipse(pawUp ? 1 : 1.5, len, 4.5, 3.4, 0, 0, 6.29); g.fill();
  g.restore();
}

// Whiskers root on the muzzle (rx,ry) and sweep outward; tips may cross the
// head rim intentionally, but the roots and most of each strand stay inside.
function drawWhiskers(g, rx, ry, wiggle) {
  g.strokeStyle = 'rgba(255,255,255,0.92)';
  g.lineWidth = 1.4; g.lineCap = 'round';
  const a = [-0.28, -0.02, 0.24];
  for (let i = 0; i < 3; i++) {
    const dy = (i - 1) * 0.8;
    const ang = a[i] + wiggle * (i - 1) * 0.12;
    const lift = Math.sin(ang * 6) * 0.9;
    // right whiskers: long sweep past the near cheek
    g.beginPath();
    g.moveTo(rx, ry + dy);
    g.lineTo(rx + 7.4, ry + (i - 1) * 0.9 + lift);
    g.stroke();
    // left whiskers: shorter sweep across the far cheek
    g.beginPath();
    g.moveTo(rx - 3.5, ry + dy);
    g.lineTo(rx - 8.5, ry + (i - 1) * 0.9 - lift);
    g.stroke();
  }
}

// Eyes anchor to EYE_L/EYE_R (head-local, symmetric-ish around the muzzle);
// the widest scared state still fits inside the head ellipse.
function drawEyes(g, scared, happy, blink) {
  const ex = [EYE_L, EYE_R];
  const r = scared ? 4.8 : 4.0;
  if (blink && !scared) {           // closed / calm eyes
    g.strokeStyle = '#2a2333'; g.lineWidth = 2; g.lineCap = 'round';
    for (const e of ex) {
      g.beginPath(); g.moveTo(e.x - 3.4, e.y); g.lineTo(e.x - 0.6, e.y); g.stroke();
      g.beginPath(); g.moveTo(e.x + 1.4, e.y); g.lineTo(e.x + 4.2, e.y); g.stroke();
    }
    return;
  }
  if (happy) {                      // ^^ happy eyes
    g.strokeStyle = '#2a2333'; g.lineWidth = 2.4; g.lineCap = 'round';
    for (const e of ex) {
      g.beginPath(); g.arc(e.x, e.y + 1.4, 3.4, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
    }
    return;
  }
  g.fillStyle = '#ffffff';
  for (const e of ex) {
    g.beginPath(); g.ellipse(e.x, e.y, r, scared ? r + 0.4 : r, 0, 0, 6.29); g.fill();
  }
  g.fillStyle = '#2f7d4f';
  for (const e of ex) {
    g.beginPath(); g.ellipse(e.x + 0.9, e.y, r * 0.55, r * 0.7, 0, 0, 6.29); g.fill();
  }
  g.fillStyle = '#141425';
  for (const e of ex) {
    g.beginPath(); g.ellipse(e.x + 0.9, e.y, r * 0.3, r * 0.5, 0, 0, 6.29); g.fill();
  }
  g.fillStyle = '#ffffff';
  for (const e of ex) {
    g.beginPath(); g.arc(e.x - 0.3, e.y - 1.8, 1.4, 0, 6.29); g.fill();
  }
  if (scared) {                     // worried brows (outer ends raised)
    g.strokeStyle = '#5a3a20'; g.lineWidth = 2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(EYE_L.x - 1.8, EYE_L.y - 5.4); g.lineTo(EYE_L.x + 2.5, EYE_L.y - 4.1); g.stroke();
    g.beginPath(); g.moveTo(EYE_R.x + 1.1, EYE_R.y - 5.0); g.lineTo(EYE_R.x - 2.5, EYE_R.y - 3.9); g.stroke();
  }
}

// Mouth anchors just below the nose on the muzzle; every mode (calm smile,
// grin, open meow) stays inside the head ellipse.
function drawMouth(g, mode, scared) {
  const mx = MUZZLE.x + 0.2, my = 6.5;
  g.strokeStyle = '#7a3b52'; g.lineWidth = 1.6; g.lineCap = 'round';
  if (mode === 'open' || scared) {   // small "o" / meowing
    g.fillStyle = '#a34a63';
    g.beginPath(); g.ellipse(mx + 0.3, my + 0.4, scared ? 2.1 : 1.9, scared ? 2.1 : 1.9, 0, 0, 6.29); g.fill();
    g.fillStyle = '#ff9db3';
    g.beginPath(); g.ellipse(mx + 0.3, my + 1.7, 1.3, 1.0, 0, 0, 6.29); g.fill();
  } else if (mode === 'grin') {       // happy smile
    g.beginPath(); g.moveTo(mx - 3.2, my - 0.2); g.quadraticCurveTo(mx, my + 2.4, mx + 3.2, my - 0.2); g.stroke();
    g.beginPath(); g.moveTo(mx, my - 0.2); g.lineTo(mx, my + 1.0); g.stroke();
  } else {                            // calm
    g.beginPath(); g.moveTo(mx - 3.4, my - 0.3); g.quadraticCurveTo(mx - 1.2, my + 1.6, mx + 0.2, my - 0.3); g.stroke();
    g.beginPath(); g.moveTo(mx + 0.2, my - 0.3); g.quadraticCurveTo(mx + 2.2, my + 1.6, mx + 4.0, my - 0.3); g.stroke();
  }
}

function drawCosmetics(g) {
  const c = tintColors();
  // collar
  if (Game.cosmetic.collar) {
    g.fillStyle = '#e0405f';
    g.beginPath(); g.ellipse(9, -20, 8.5, 3.6, -0.25, 0, 6.29); g.fill();
    g.fillStyle = '#ffd23d';
    g.beginPath(); g.arc(13, -16.5, 3.2, 0, 6.29); g.fill();
    g.fillStyle = '#c98a00';
    g.beginPath(); g.arc(13, -15.6, 1.2, 0, 6.29); g.fill();
  }
  // hat
  const hat = Game.cosmetic.hat;
  if (hat === 'party') {
    g.save(); g.translate(13, -38); g.rotate(0.22);
    g.fillStyle = '#ff5f7e';
    g.beginPath(); g.moveTo(-9, 2); g.lineTo(0, -18); g.lineTo(9, 2); g.closePath(); g.fill();
    g.fillStyle = '#4ad6c0';
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.ellipse(i * 5, -2 - Math.abs(i) * 4, 4, 2.4, 0, 0, 6.29); g.fill(); }
    g.fillStyle = '#ffe66d'; g.beginPath(); g.arc(0, -19, 3.6, 0, 6.29); g.fill();
    g.restore();
  } else if (hat === 'cap') {
    g.save(); g.translate(13, -37); g.rotate(0.1);
    g.fillStyle = '#3fa9f5';
    g.beginPath(); g.ellipse(0, 0, 11, 7, 0, Math.PI, 0); g.fill();
    g.fillRect(-11, -1, 22, 3);
    g.fillStyle = '#2b7fc4';
    g.beginPath(); g.ellipse(11, 1, 9, 3.4, 0, 0, Math.PI); g.fill();
    g.restore();
  } else if (hat === 'crown') {
    g.save(); g.translate(13, -38);
    g.fillStyle = '#ffd23d';
    g.beginPath();
    g.moveTo(-10, 3); g.lineTo(-10, -5); g.lineTo(-5, -1); g.lineTo(0, -8);
    g.lineTo(5, -1); g.lineTo(10, -5); g.lineTo(10, 3); g.closePath(); g.fill();
    g.fillStyle = '#ff5f7e'; g.beginPath(); g.arc(0, -1, 2, 0, 6.29); g.fill();
    g.restore();
  } else if (hat === 'bandana') {
    g.save(); g.translate(12, -36); g.rotate(-0.06);
    g.fillStyle = '#7a4dff';
    g.fillRect(-12, -3, 24, 6);
    g.beginPath(); g.moveTo(-12, 0); g.lineTo(-20, -6); g.lineTo(-18, 4); g.closePath(); g.fill();
    g.restore();
  }
}

// Head-local geometry: every facial feature is anchored to this ellipse and
// stays strictly inside it (ears/tail attach intentionally beyond the rim).
const HEAD = { x: 13, y: -27, rx: 13, ry: 11.5 };
const EYE_L = { x: -3.6, y: -3.5 };
const EYE_R = { x: 5.2, y: -3.5 };
const MUZZLE = { x: 5.2, y: 4, rx: 5.6, ry: 4.1 };
const CHEEK = { x: 3.8, y: 3, rx: 7.8, ry: 5.9 };

// main entry: draw at feet-center (x,y) in world/screen coords
function drawKitten(g, x, y, opts) {
  opts = opts || {};
  const pose = opts.pose || Kitten.pose;
  const face = opts.face || Kitten.face;
  const alpha = opts.alpha !== undefined ? opts.alpha : 1;
  const scared = opts.scared !== undefined ? opts.scared : Kitten.scared;
  const happy = opts.happy !== undefined ? opts.happy : (Kitten.happyT > 0);
  const blink = (opts.blink !== undefined ? opts.blink : Kitten.blinkT < 0.22) && !scared;
  const c = tintColors();
  const t = Kitten.animT;
  const cycle = Kitten.runCycle;
  const ghost = opts.ghost || false;

  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y);
  g.scale(face, 1);

  if (ghost) g.globalAlpha *= 0.35;

  // --- body transform per pose ---
  let bob = 0, lean = 0, squashX = 1, squashY = 1, bodyRot = 0;
  if (pose === 'run') {
    bob = Math.abs(Math.sin(cycle)) * -2.2;
    lean = 0.10;
    squashY = 1 - Math.abs(Math.sin(cycle)) * 0.06;
    bodyRot = Math.sin(cycle) * 0.05;
  } else if (pose === 'idle') {
    bob = Math.sin(t * 2.4) * 1.1;
    bodyRot = Math.sin(t * 1.4) * 0.03;
  } else if (pose === 'jump') {
    lean = -0.16; squashY = 1.05; bob = -1;
  } else if (pose === 'float') {
    lean = -0.05; bob = Math.sin(t * 5) * 1.4;
  } else if (pose === 'fall') {
    lean = 0.2; squashY = 1.04;
  } else if (pose === 'land') {
    bob = 5; squashY = 0.78; squashX = 1.14; lean = 0.14;
  } else if (pose === 'stretch') {
    squashX = 1.3; squashY = 0.86; lean = 0.05;
  } else if (pose === 'catch') {
    lean = -0.5; bob = -6; bodyRot = Math.sin(t * 18) * 0.3;
  }

  g.translate(0, bob);
  g.rotate(bodyRot + lean * 0.5);
  g.scale(squashX, squashY);

  // --- shadow ---
  g.save();
  g.scale(face, 1);
  g.globalAlpha *= 0.25;
  g.fillStyle = '#000';
  g.beginPath(); g.ellipse(0, 2 - bob, 16, 4.2, 0, 0, 6.29); g.fill();
  g.restore();
  g.globalAlpha = alpha * (ghost ? 0.35 : 1);

  // --- tail (behind body) ---
  drawTail(g, t);

  // --- legs ---
  const legsPh = pose === 'run' ? Math.sin(cycle) : 0;
  if (pose === 'run') {
    drawLeg(g, -8, -10, 11, legsPh * 0.75, 7, false);
    drawLeg(g, 8, -11, 11, -legsPh * 0.75, 7, false);
    drawLeg(g, -6, -10, 11, -legsPh * 0.75, 6.5, false);
    drawLeg(g, 10, -11, 11, legsPh * 0.75, 6.5, false);
  } else if (pose === 'jump' || pose === 'stretch') {
    // front paws reach forward, back paws trail
    drawLeg(g, 10, -13, 12, -0.9, 7, true);
    drawLeg(g, 12, -11, 12, -0.6, 6.5, true);
    drawLeg(g, -8, -11, 11, 0.7, 7, false);
    drawLeg(g, -6, -10, 11, 0.45, 6.5, false);
  } else if (pose === 'fall' || pose === 'float' || pose === 'catch') {
    drawLeg(g, 10, -12, 12, -0.5 + Math.sin(t * 9) * 0.2, 7, true);
    drawLeg(g, 12, -10, 12, -0.2 + Math.sin(t * 9 + 1) * 0.2, 6.5, true);
    drawLeg(g, -8, -12, 12, 0.5 + Math.sin(t * 9 + 2) * 0.2, 7, false);
    drawLeg(g, -6, -10, 12, 0.3 + Math.sin(t * 9 + 3) * 0.2, 6.5, false);
  } else if (pose === 'land') {
    drawLeg(g, -9, -8, 9, 0.5, 7, false);
    drawLeg(g, -5, -8, 9, 0.3, 6.5, false);
    drawLeg(g, 8, -8, 9, -0.5, 7, false);
    drawLeg(g, 12, -8, 9, -0.3, 6.5, false);
  } else {   // idle
    drawLeg(g, -8, -10, 11, 0.06, 7, false);
    drawLeg(g, -4, -10, 11, -0.04, 6.5, false);
    drawLeg(g, 8, -11, 11, -0.06, 7, false);
    drawLeg(g, 12, -11, 11, 0.04, 6.5, false);
  }

  // --- body ---
  g.fillStyle = c.main;
  g.beginPath(); g.ellipse(-1, -16, 17, 12.5, 0, 0, 6.29); g.fill();
  // belly
  g.fillStyle = c.light;
  g.beginPath(); g.ellipse(1, -11.5, 11, 6.5, 0, 0, 6.29); g.fill();
  // back stripes
  g.fillStyle = c.dark;
  g.save(); g.beginPath(); g.ellipse(-1, -16, 17, 12.5, 0, 0, 6.29); g.clip();
  for (let i = 0; i < 3; i++) {
    g.beginPath();
    g.ellipse(-13 + i * 7, -25, 2.4, 6, 0.3, 0, 6.29); g.fill();
  }
  g.restore();
  // soft outline
  g.strokeStyle = 'rgba(90,50,20,0.35)'; g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(-1, -16, 17, 12.5, 0, 0, 6.29); g.stroke();

  // --- front chest patch ---
  g.fillStyle = c.light;
  g.beginPath(); g.ellipse(9, -14, 7, 7.5, 0, 0, 6.29); g.fill();

  // --- head (features anchor to the HEAD ellipse and stay inside it) ---
  g.save();
  g.translate(HEAD.x, HEAD.y);
  g.rotate(pose === 'run' ? Math.sin(cycle) * 0.05 : (pose === 'catch' ? 0.1 : 0));
  // ears: base overlaps the head rim so the attachment never leaves a gap
  earShape(g, -7.5, -7, 1, false, 0.12);
  earShape(g, 8, -8, 1, true, 0.12);
  // head base
  g.fillStyle = c.main;
  g.beginPath(); g.ellipse(0, 0, HEAD.rx, HEAD.ry, 0, 0, 6.29); g.fill();
  g.fillStyle = c.light;
  g.beginPath(); g.ellipse(CHEEK.x, CHEEK.y, CHEEK.rx, CHEEK.ry, 0, 0, 6.29); g.fill();
  // forehead marks
  g.fillStyle = c.dark;
  g.beginPath(); g.ellipse(-3.6, -6.6, 1.8, 3.6, -0.3, 0, 6.29); g.fill();
  g.beginPath(); g.ellipse(1, -7, 1.6, 3.6, 0.05, 0, 6.29); g.fill();
  // muzzle
  g.fillStyle = '#fffdf7';
  g.beginPath(); g.ellipse(MUZZLE.x, MUZZLE.y, MUZZLE.rx, MUZZLE.ry, 0, 0, 6.29); g.fill();
  // nose (sits on top of the muzzle)
  g.fillStyle = '#ff7a95';
  g.beginPath();
  g.moveTo(3.4, 2.2); g.lineTo(7.4, 2.2); g.lineTo(5.4, 5.2); g.closePath(); g.fill();
  // eyes
  drawEyes(g, scared, happy, blink);
  // mouth (just under the nose, on the muzzle)
  const mouthMode = pose === 'catch' ? 'open' : (happy ? 'grin' : (scared ? 'open' : 'smile'));
  drawMouth(g, mouthMode, scared);
  // whiskers (roots on the muzzle, sweeping outward across the cheeks)
  drawWhiskers(g, MUZZLE.x + 1.8, MUZZLE.y - 0.6, Math.sin(Kitten.whiskerT * 4));
  // blush when happy
  if (happy) {
    g.fillStyle = 'rgba(255,120,150,0.5)';
    g.beginPath(); g.ellipse(-4.5, 4, 2.6, 1.7, 0, 0, 6.29); g.fill();
    g.beginPath(); g.ellipse(9.4, 3.2, 2.4, 1.6, 0, 0, 6.29); g.fill();
  }
  g.restore();

  // cosmetics (collar, hats) anchor to the head in body space
  drawCosmetics(g);

  // catch pose: swirl eyes overlay + "!" mark
  if (pose === 'catch') {
    g.strokeStyle = '#2a2333'; g.lineWidth = 2;
    for (const ex of [EYE_L, EYE_R]) {
      g.beginPath();
      for (let a = 0; a < 6.28; a += 0.6) {
        const rr = 1 + a * 0.7;
        const px = HEAD.x + ex.x + Math.cos(a + t * 6) * rr;
        const py = HEAD.y + ex.y + Math.sin(a + t * 6) * rr;
        if (a === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.stroke();
    }
  }

  g.restore();
}

// ============================================================
// WORLD RENDERER  (sky, parallax, platforms, decor)
// ============================================================
const Parallax = {
  clouds: [],
  birds: [],
  stars: [],
  init() {
    this.clouds.length = 0; this.birds.length = 0; this.stars.length = 0;
    for (let i = 0; i < 9; i++) this.clouds.push({ x: rand(0, VIEW_W * 2), y: rand(30, 200), s: rand(0.6, 1.5), v: rand(6, 16) });
    for (let i = 0; i < 5; i++) this.birds.push({ x: rand(0, VIEW_W), y: rand(50, 170), v: rand(26, 46), p: rand(0, 6) });
    for (let i = 0; i < 70; i++) this.stars.push({ x: rand(0, VIEW_W), y: rand(0, VIEW_H * 0.72), s: rand(0.6, 1.9), p: rand(0, 6) });
  },
  update(dt, camX) {
    for (const c of this.clouds) {
      c.x += c.v * dt;
      if (c.x > VIEW_W + 220) { c.x = -220; c.y = rand(30, 200); }
    }
    for (const b of this.birds) {
      b.x += b.v * dt; b.p += dt * 8;
      if (b.x > VIEW_W + 60) { b.x = -60; b.y = rand(50, 175); }
    }
  }
};

function roundRectPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function drawSky(g, camX) {
  const moon = Game.realm === REALM.MOON;
  const grad = g.createLinearGradient(0, 0, 0, VIEW_H);
  if (moon) {
    grad.addColorStop(0, '#101033');
    grad.addColorStop(0.55, '#2b2160');
    grad.addColorStop(1, '#5a3a86');
  } else {
    grad.addColorStop(0, '#5ec8f5');
    grad.addColorStop(0.5, '#a5e3ff');
    grad.addColorStop(1, '#ffe6a8');
  }
  g.fillStyle = grad;
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  if (moon) {
    // stars
    for (const s of Parallax.stars) {
      const tw = 0.55 + Math.sin(Game.time * 2 + s.p) * 0.4;
      g.globalAlpha = clamp(tw, 0.1, 1);
      g.fillStyle = '#ffffff';
      g.fillRect(s.x, s.y, s.s, s.s);
    }
    g.globalAlpha = 1;
    // moon
    const mx = VIEW_W * 0.78, my = 96;
    g.fillStyle = '#fff6d8';
    g.beginPath(); g.arc(mx, my, 44, 0, 6.29); g.fill();
    g.fillStyle = '#e8dfba';
    g.beginPath(); g.arc(mx - 14, my - 8, 8, 0, 6.29); g.fill();
    g.beginPath(); g.arc(mx + 10, my + 14, 6, 0, 6.29); g.fill();
    g.beginPath(); g.arc(mx + 16, my - 16, 4.5, 0, 6.29); g.fill();
    g.globalAlpha = 0.18; g.fillStyle = '#fff6d8';
    g.beginPath(); g.arc(mx, my, 62, 0, 6.29); g.fill();
    g.globalAlpha = 1;
  } else {
    // sun
    const sx = VIEW_W * 0.8, sy = 92;
    g.globalAlpha = 0.28; g.fillStyle = '#fff3b0';
    g.beginPath(); g.arc(sx, sy, 70, 0, 6.29); g.fill();
    g.globalAlpha = 1; g.fillStyle = '#fff27a';
    g.beginPath(); g.arc(sx, sy, 42, 0, 6.29); g.fill();
    g.fillStyle = '#ffe95e';
    g.beginPath(); g.arc(sx, sy, 34, 0, 6.29); g.fill();
  }

  // clouds
  if (!moon) {
    g.fillStyle = 'rgba(255,255,255,0.92)';
    for (const c of Parallax.clouds) {
      const s = c.s;
      g.beginPath();
      g.arc(c.x, c.y, 20 * s, 0, 6.29);
      g.arc(c.x + 22 * s, c.y - 8 * s, 26 * s, 0, 6.29);
      g.arc(c.x + 50 * s, c.y, 20 * s, 0, 6.29);
      g.arc(c.x + 26 * s, c.y + 8 * s, 24 * s, 0, 6.29);
      g.fill();
    }
  } else {
    // wispy night clouds
    g.fillStyle = 'rgba(120,110,190,0.35)';
    for (const c of Parallax.clouds) {
      const s = c.s * 1.1;
      g.beginPath();
      g.ellipse(c.x + 24 * s, c.y, 44 * s, 14 * s, 0, 0, 6.29);
      g.fill();
    }
  }

  // birds (day only)
  if (!moon) {
    g.strokeStyle = '#3a4a6b'; g.lineWidth = 2.4; g.lineCap = 'round';
    for (const b of Parallax.birds) {
      const f = Math.sin(b.p) * 6;
      g.beginPath();
      g.moveTo(b.x - 8, b.y - f);
      g.quadraticCurveTo(b.x, b.y + 4, b.x, b.y);
      g.quadraticCurveTo(b.x, b.y + 4, b.x + 8, b.y - f);
      g.stroke();
    }
  }
}

function drawParallaxTown(g, camX) {
  const moon = Game.realm === REALM.MOON;
  // --- far houses (slow) ---
  const farOff = camX * 0.25;
  g.save();
  g.translate(-(farOff % 420), 0);
  for (let i = -1; i < 4; i++) {
    const bx = i * 420;
    const hh = 150 + ((i * 97) % 70);
    g.fillStyle = moon ? '#2a2350' : '#f3c9a0';
    g.fillRect(bx, GROUND_Y - hh - 60, 190, hh + 60);
    g.fillStyle = moon ? '#221c44' : '#e0b184';
    g.beginPath();
    g.moveTo(bx - 14, GROUND_Y - hh - 60);
    g.lineTo(bx + 95, GROUND_Y - hh - 118);
    g.lineTo(bx + 204, GROUND_Y - hh - 60);
    g.closePath(); g.fill();
    // windows
    const wc = moon ? '#ffe66d' : '#8fd7ff';
    g.fillStyle = wc;
    for (let r = 0; r < 3; r++) for (let c2 = 0; c2 < 4; c2++) {
      if ((r * 4 + c2 + i) % 3 === 0) continue;
      g.fillRect(bx + 18 + c2 * 42, GROUND_Y - hh - 34 + r * 44, 24, 26);
    }
    const bx2 = bx + 230;
    const hh2 = 110 + ((i * 53) % 60);
    g.fillStyle = moon ? '#241e46' : '#e9b7c6';
    g.fillRect(bx2, GROUND_Y - hh2 - 40, 160, hh2 + 40);
    g.fillStyle = moon ? '#1d183a' : '#d79cad';
    g.fillRect(bx2 - 10, GROUND_Y - hh2 - 52, 180, 16);
  }
  g.restore();

  // --- mid trees / fences (medium) ---
  const midOff = camX * 0.5;
  g.save();
  g.translate(-(midOff % 360), 0);
  for (let i = -1; i < 5; i++) {
    const tx = i * 360 + 60;
    g.fillStyle = moon ? '#1b3a34' : '#7a5a3a';
    g.fillRect(tx, GROUND_Y - 78, 16, 78);
    g.fillStyle = moon ? '#1f4a40' : '#4fae62';
    g.beginPath(); g.arc(tx + 8, GROUND_Y - 92, 42, 0, 6.29); g.fill();
    g.beginPath(); g.arc(tx - 22, GROUND_Y - 74, 30, 0, 6.29); g.fill();
    g.beginPath(); g.arc(tx + 38, GROUND_Y - 76, 30, 0, 6.29); g.fill();
    g.fillStyle = moon ? '#2a5c50' : '#66c47a';
    g.beginPath(); g.arc(tx - 4, GROUND_Y - 104, 20, 0, 6.29); g.fill();
    // picket fence
    const fx = tx + 120;
    g.fillStyle = moon ? '#3a3355' : '#fff3df';
    for (let k = 0; k < 7; k++) {
      const px = fx + k * 26;
      g.fillRect(px, GROUND_Y - 54, 16, 54);
      g.beginPath();
      g.moveTo(px, GROUND_Y - 54); g.lineTo(px + 8, GROUND_Y - 66); g.lineTo(px + 16, GROUND_Y - 54);
      g.closePath(); g.fill();
    }
    g.fillStyle = moon ? '#2f2949' : '#e8d6bd';
    g.fillRect(fx - 6, GROUND_Y - 44, 200, 8);
    g.fillRect(fx - 6, GROUND_Y - 22, 200, 8);
  }
  g.restore();
}

function drawGround(g, camX) {
  const moon = Game.realm === REALM.MOON;
  for (const p of WORLD.plats) {
    if (p.type !== 'ground') continue;
    const sx = p.x - camX;
    if (sx > VIEW_W + 40 || sx + p.w < -40) continue;
    if (p.type === 'ground') {
      // pit-danger edge glow: contrasting colors near gap
      const topGrad = g.createLinearGradient(0, p.y, 0, p.y + p.h);
      if (moon) {
        topGrad.addColorStop(0, '#5e4a97');
        topGrad.addColorStop(0.06, '#4a3a80');
        topGrad.addColorStop(1, '#241d47');
      } else {
        topGrad.addColorStop(0, '#8fd97a');
        topGrad.addColorStop(0.06, '#7cc96a');
        topGrad.addColorStop(1, '#c9a06a');
      }
      g.fillStyle = topGrad;
      g.fillRect(sx, p.y, p.w, p.h);
      // top rim
      g.fillStyle = moon ? '#8a76d8' : '#a8e88f';
      g.fillRect(sx, p.y, p.w, 7);
      // sidewalk lines
      g.strokeStyle = moon ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.45)';
      g.lineWidth = 2;
      const step = 64;
      const start = Math.ceil((camX - p.x) / step) * step;
      for (let o = start; o < p.w; o += step) {
        g.beginPath();
        g.moveTo(sx + o, p.y + 10);
        g.lineTo(sx + o, p.y + 44);
        g.stroke();
      }
      // grass tufts
      g.fillStyle = moon ? '#3f7a5c' : '#5cb860';
      for (let o = 0; o < p.w; o += 26) {
        const gx = sx + o;
        if (gx < -20 || gx > VIEW_W + 20) continue;
        g.beginPath();
        g.moveTo(gx, p.y + 1);
        g.lineTo(gx + 5, p.y - 7);
        g.lineTo(gx + 9, p.y + 1);
        g.closePath(); g.fill();
      }
      // danger edge markers at both ends (readable gap warning)
      g.fillStyle = moon ? '#ff5f7e' : '#ff7043';
      g.fillRect(sx - 3, p.y - 4, 6, 10);
      g.fillRect(sx + p.w - 3, p.y - 4, 6, 10);
    }
  }

  // pit depths (dark alley between gaps)
  g.save();
  const pit = g.createLinearGradient(0, GROUND_Y, 0, VIEW_H);
  pit.addColorStop(0, 'rgba(10,8,26,0.55)');
  pit.addColorStop(1, 'rgba(4,3,12,0.95)');
  g.fillStyle = pit;
  // find gaps in ground coverage
  let cursor = null;
  const grounds = WORLD.plats.filter(p => p.type === 'ground').sort((a, b) => a.x - b.x);
  for (const p of grounds) {
    const sx = p.x - camX;
    if (cursor === null) {
      if (sx > 0) g.fillRect(0, GROUND_Y + 6, Math.min(sx, VIEW_W), VIEW_H - GROUND_Y);
      cursor = sx + p.w;
    } else {
      if (sx > cursor) g.fillRect(cursor, GROUND_Y + 6, sx - cursor, VIEW_H - GROUND_Y);
      cursor = Math.max(cursor, sx + p.w);
    }
  }
  if (cursor !== null && cursor < VIEW_W) g.fillRect(cursor, GROUND_Y + 6, VIEW_W - cursor, VIEW_H - GROUND_Y);
  g.restore();
}

function drawPlatforms(g, camX) {
  const moon = Game.realm === REALM.MOON;
  for (const p of WORLD.plats) {
    if (p.type === 'ground') continue;
    const sx = p.x - camX;
    if (sx > VIEW_W + 60 || sx + p.w < -60) continue;
    const vis = WORLD.platformVisible(p);
    g.save();
    g.globalAlpha = vis ? 1 : 0.16;

    if (p.type === 'crate') {
      g.fillStyle = moon ? '#6b5a3e' : '#d9a05b';
      g.fillRect(sx, p.y, p.w, p.h);
      g.strokeStyle = moon ? '#4a3f2b' : '#a9743a'; g.lineWidth = 3;
      g.strokeRect(sx + 2, p.y + 2, p.w - 4, p.h - 4);
      g.beginPath();
      g.moveTo(sx + 3, p.y + 3); g.lineTo(sx + p.w - 3, p.y + p.h - 3);
      g.moveTo(sx + p.w - 3, p.y + 3); g.lineTo(sx + 3, p.y + p.h - 3);
      g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.25)';
      g.fillRect(sx, p.y, p.w, 5);
    } else if (p.type === 'fence') {
      g.fillStyle = moon ? '#7d74a8' : '#fff0d6';
      g.fillRect(sx, p.y, p.w, p.h);
      g.beginPath();
      g.moveTo(sx - 3, p.y); g.lineTo(sx + p.w / 2, p.y - 14); g.lineTo(sx + p.w + 3, p.y);
      g.closePath(); g.fill();
      g.fillStyle = moon ? '#5e5690' : '#e6d3b6';
      g.fillRect(sx, p.y + 14, p.w, 6);
      g.fillRect(sx, p.y + 30, p.w, 6);
    } else if (p.type === 'wall') {
      g.fillStyle = moon ? '#4b4470' : '#e5d3b8';
      g.fillRect(sx, p.y, p.w, p.h);
      g.fillStyle = moon ? '#3a3459' : '#cfb998';
      for (let o = 0; o < p.w; o += 22) g.fillRect(sx + o, p.y + 6, 18, p.h - 10);
      g.fillStyle = moon ? '#8a7ad0' : '#7cc96a';
      g.fillRect(sx - 2, p.y - 5, p.w + 4, 6);
    } else if (p.type === 'plat') {
      const col = p.r === 0 ? '#ffb457' : (p.r === 1 ? '#8f7bff' : (moon ? '#7f6ad8' : '#ffcf7a'));
      g.fillStyle = col;
      roundRectPath(g, sx, p.y, p.w, p.h, 6); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.45)';
      roundRectPath(g, sx + 2, p.y + 2, p.w - 4, 5, 3); g.fill();
      // underside pattern + realm glyph
      g.fillStyle = 'rgba(0,0,0,0.22)';
      for (let o = 8; o < p.w - 6; o += 16) g.fillRect(sx + o, p.y + p.h - 6, 8, 4);
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.font = 'bold 11px "Trebuchet MS", sans-serif';
      g.textAlign = 'center';
      if (p.r !== 2) g.fillText(p.r === 0 ? 'SOL' : 'LUNA', sx + p.w / 2, p.y - 5);
      // glow when visible
      if (vis) {
        g.globalAlpha = 0.25 + Math.sin(Game.time * 4 + p.x * 0.01) * 0.12;
        g.fillStyle = p.r === 0 ? '#ffe66d' : '#9d8cff';
        roundRectPath(g, sx - 3, p.y - 3, p.w + 6, p.h + 6, 8); g.fill();
      }
    }

    // unified "you can stand here" read: crisp outline + landing highlight,
    // so every interactive solid shares one unmistakable visual language
    g.globalAlpha = vis ? 1 : 0.16;
    if (p.type === 'plat') {
      g.strokeStyle = moon ? 'rgba(8,6,24,0.7)' : 'rgba(60,30,8,0.55)';
      g.lineWidth = 2.5;
      roundRectPath(g, sx, p.y, p.w, p.h, 6); g.stroke();
    } else {
      g.strokeStyle = moon ? 'rgba(8,6,24,0.75)' : 'rgba(46,26,10,0.6)';
      g.lineWidth = 2.5;
      g.strokeRect(sx + 1.25, p.y + 1.25, p.w - 2.5, p.h - 2.5);
      g.fillStyle = moon ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.5)';
      g.fillRect(sx + 4, p.y + 3, p.w - 8, 3);
    }
    g.restore();
  }
}

// DECOR  (bushes, streetlights, boxes, bins, signs, birds...)

function drawDeco(g, camX) {
  const moon = Game.realm === REALM.MOON;
  for (const d of WORLD.deco) {
    const sx = d.x - camX;
    if (sx < -140 || sx > VIEW_W + 140) continue;
    const s = d.scale;
    g.save();
    if (d.kind !== 'cloud' && d.kind !== 'bird') {
      // scenery recedes so interactive solids stay the crispest thing on screen
      g.globalAlpha = 0.7;
    }
    if (d.kind === 'cloud' || d.kind === 'bird') {
      // sky decor: reposition above the street
      g.translate(sx, 70 + Math.abs(Math.sin(d.x * 0.37)) * 130);
    } else {
      g.translate(sx, d.y);
    }
    g.scale(s, s);
    switch (d.kind) {
      case 'bush': {
        g.fillStyle = moon ? '#1f4a3f' : '#3f9e57';
        g.beginPath();
        g.arc(-16, -14, 17, 0, 6.29);
        g.arc(2, -24, 22, 0, 6.29);
        g.arc(22, -13, 16, 0, 6.29);
        g.fill();
        g.fillStyle = moon ? '#2a6152' : '#57b86d';
        g.beginPath(); g.arc(-2, -30, 13, 0, 6.29); g.fill();
        if (!moon) {
          g.fillStyle = '#ff8fb0';
          g.beginPath(); g.arc(10, -22, 3.4, 0, 6.29); g.arc(-14, -16, 3, 0, 6.29); g.fill();
        }
        break;
      }
      case 'tree': {
        g.fillStyle = '#7a5535';
        g.fillRect(-9, -90, 18, 90);
        g.fillStyle = moon ? '#1f4a3f' : '#46a85e';
        g.beginPath();
        g.arc(0, -116, 42, 0, 6.29);
        g.arc(-34, -96, 30, 0, 6.29);
        g.arc(34, -96, 30, 0, 6.29);
        g.fill();
        break;
      }
      case 'lamp': {
        g.fillStyle = '#3a3f57';
        g.fillRect(-5, -130, 10, 130);
        g.beginPath(); g.ellipse(0, -4, 16, 7, 0, 0, 6.29); g.fill();
        g.fillRect(-16, -134, 34, 8);
        g.fillStyle = moon ? '#ffe9a8' : '#c9d6ea';
        g.beginPath(); g.ellipse(12, -124, 12, 10, 0, 0, 6.29); g.fill();
        if (moon) {
          g.globalAlpha = 0.35;
          const lg = g.createRadialGradient(12, -120, 4, 12, -60, 90);
          lg.addColorStop(0, 'rgba(255,230,150,0.8)');
          lg.addColorStop(1, 'rgba(255,230,150,0)');
          g.fillStyle = lg;
          g.beginPath(); g.moveTo(12, -124); g.lineTo(-56, 4); g.lineTo(80, 4); g.closePath(); g.fill();
          g.globalAlpha = 1;
        }
        break;
      }
      case 'fence': {
        g.fillStyle = moon ? '#4a4470' : '#f6e6cf';
        for (let k = -1; k <= 1; k++) {
          g.fillRect(k * 22 - 7, -46, 14, 46);
          g.beginPath();
          g.moveTo(k * 22 - 7, -46); g.lineTo(k * 22, -57); g.lineTo(k * 22 + 7, -46);
          g.closePath(); g.fill();
        }
        g.fillStyle = moon ? '#3a3459' : '#e0cdb2';
        g.fillRect(-36, -36, 72, 6);
        g.fillRect(-36, -16, 72, 6);
        break;
      }
      case 'house': {
        g.fillStyle = moon ? '#2c2654' : '#ffd9b0';
        g.fillRect(-60, -120, 120, 120);
        g.fillStyle = moon ? '#221d44' : '#ff9f7a';
        g.beginPath(); g.moveTo(-72, -120); g.lineTo(0, -168); g.lineTo(72, -120); g.closePath(); g.fill();
        g.fillStyle = moon ? '#ffe66d' : '#9fe4ff';
        g.fillRect(-40, -100, 34, 34); g.fillRect(8, -100, 34, 34);
        g.fillStyle = moon ? '#3f3768' : '#b0754f';
        g.fillRect(-16, -54, 32, 54);
        g.fillStyle = '#ffd23d';
        g.beginPath(); g.arc(8, -30, 3, 0, 6.29); g.fill();
        break;
      }
      case 'box': {
        g.fillStyle = moon ? '#6b5a3e' : '#d9a05b';
        g.fillRect(-20, -34, 40, 34);
        g.strokeStyle = moon ? '#4a3f2b' : '#a9743a'; g.lineWidth = 2.5;
        g.strokeRect(-18, -32, 36, 30);
        g.beginPath(); g.moveTo(-18, -32); g.lineTo(18, -2); g.moveTo(18, -32); g.lineTo(-18, -2);
        g.stroke();
        break;
      }
      case 'bin': {
        g.fillStyle = moon ? '#3a5f52' : '#4a9d8f';
        g.beginPath();
        g.moveTo(-16, -40); g.lineTo(16, -40); g.lineTo(12, 0); g.lineTo(-12, 0);
        g.closePath(); g.fill();
        g.fillStyle = moon ? '#2e4b41' : '#3b8478';
        g.fillRect(-19, -48, 38, 9);
        g.fillStyle = 'rgba(255,255,255,0.25)';
        g.fillRect(-9, -36, 5, 30);
        g.fillRect(4, -36, 5, 30);
        break;
      }
      case 'plant': {
        g.fillStyle = '#d96b4a';
        g.beginPath(); g.moveTo(-12, -16); g.lineTo(12, -16); g.lineTo(9, 0); g.lineTo(-9, 0);
        g.closePath(); g.fill();
        g.fillStyle = moon ? '#2f7a5c' : '#4fb86a';
        g.beginPath();
        g.ellipse(-6, -26, 6, 12, -0.5, 0, 6.29);
        g.ellipse(6, -26, 6, 12, 0.5, 0, 6.29);
        g.ellipse(0, -32, 6, 13, 0, 0, 6.29);
        g.fill();
        break;
      }
      case 'sign': {
        g.fillStyle = '#8a6b4a';
        g.fillRect(-3, -46, 6, 46);
        g.fillStyle = moon ? '#4a4470' : '#fff6e3';
        roundRectPath(g, -30, -70, 60, 28, 5); g.fill();
        g.fillStyle = '#e05a4a';
        g.font = 'bold 11px "Trebuchet MS", sans-serif';
        g.textAlign = 'center';
        g.fillText('¡CUIDADO!', 0, -52);
        break;
      }
      case 'cloud': {
        g.fillStyle = moon ? 'rgba(140,130,210,0.4)' : 'rgba(255,255,255,0.85)';
        g.beginPath();
        g.arc(-18, 0, 16, 0, 6.29); g.arc(0, -10, 21, 0, 6.29);
        g.arc(22, 0, 16, 0, 6.29); g.arc(0, 6, 18, 0, 6.29);
        g.fill();
        break;
      }
      case 'bird': {
        const h = Math.sin(Game.time * 3 + d.x) * 4;
        g.strokeStyle = '#3a4a6b'; g.lineWidth = 2.4; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(-9, h - 6); g.quadraticCurveTo(0, h + 3, 0, h);
        g.quadraticCurveTo(0, h + 3, 9, h - 6);
        g.stroke();
        break;
      }
    }
    g.restore();
  }
}

// ============================================================
// DOG RENDERER  (cartoon-expressive, distinct breeds)
// ============================================================
function drawDog(g, d, camX) {
  const sx = d.x - camX;
  if (sx < -160 || sx > VIEW_W + 160) return;
  const b = d.breed;
  const t = d.t;
  const same = (d.realm === Game.realm) || d.realm === 2;

  g.save();
  g.globalAlpha = (same ? 1 : 0.28) * clamp(d.alpha, 0, 1);
  g.translate(sx + d.w / 2, d.y + d.h);
  const dirF = d.dir >= 0 ? 1 : -1;
  g.scale(dirF, 1);

  if (!same) {
    // other-realm dogs: ghostly outline only
    g.strokeStyle = 'rgba(180,170,255,0.8)';
    g.lineWidth = 2;
    g.setLineDash([5, 5]);
    roundRectPath(g, -d.w / 2, -d.h, d.w, d.h, 10);
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha *= 0.5;
    g.fillStyle = 'rgba(160,150,255,0.25)';
    g.fillRect(-d.w / 2, -d.h, d.w, d.h);
    g.restore();
    drawDogLabel(g, d, sx, same);
    return;
  }

  const running = d.state === 'chase' || d.state === 'leap' || (d.state === 'patrol' && Math.abs(d.vx) > 5) || d.state === 'patrol';
  const warn = d.state === 'warn' || d.state === 'bark';
  const cycle = d.cycle * (d.state === 'chase' ? 16 : 9);
  const bob = running ? Math.abs(Math.sin(cycle)) * -2.5 : Math.sin(t * 2) * 1.2;
  const crouch = warn ? Math.abs(Math.sin(t * 26)) * 3 : 0;

  g.translate(0, bob - crouch * 0.5);

  const W = d.w, H = d.h;
  const bodyY = -H * 0.62;

  // shadow
  g.save(); g.scale(dirF, 1); g.globalAlpha *= 0.3;
  g.fillStyle = '#000';
  g.beginPath(); g.ellipse(0, 2 - bob, W * 0.42, 5, 0, 0, 6.29); g.fill();
  g.restore();
  g.globalAlpha = (same ? 1 : 0.28) * clamp(d.alpha, 0, 1);

  // ---- legs ----
  const legs = [
    { x: -W * 0.3, phase: 0, front: false },
    { x: -W * 0.22, phase: Math.PI, front: false },
    { x: W * 0.26, phase: Math.PI, front: true },
    { x: W * 0.34, phase: 0, front: true }
  ];
  for (const l of legs) {
    const swing = running ? Math.sin(cycle + l.phase) * 0.7 : (warn ? -0.4 : 0.05);
    g.save();
    g.translate(l.x, bodyY + H * 0.24);
    g.rotate(swing);
    g.strokeStyle = b.color;
    g.lineWidth = W * 0.13; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, H * 0.34); g.stroke();
    g.fillStyle = b.color2;
    g.beginPath(); g.ellipse(2, H * 0.34, W * 0.1, W * 0.07, 0, 0, 6.29); g.fill();
    g.restore();
  }

  // ---- tail ----
  g.save();
  g.translate(-W * 0.44, bodyY - H * 0.06);
  const tw = running ? Math.sin(cycle * 1.4) * 0.5 : Math.sin(t * 4) * 0.4;
  g.rotate(-0.8 + tw);
  g.strokeStyle = b.color;
  g.lineWidth = W * 0.12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-W * 0.2, -H * 0.2, -W * 0.1, -H * 0.42); g.stroke();
  if (b.id === 'poodle') {
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-W * 0.1, -H * 0.44, W * 0.1, 0, 6.29); g.fill();
  }
  g.restore();

  // ---- body ----
  g.fillStyle = b.color;
  const stretch = d.state === 'leap' ? 1.12 : 1;
  g.save();
  g.scale(stretch, d.state === 'warn' ? 0.92 : 1);
  g.beginPath(); g.ellipse(0, bodyY, W * 0.44, H * 0.34, 0, 0, 6.29); g.fill();
  g.strokeStyle = 'rgba(60,35,15,0.35)'; g.lineWidth = 1.6;
  g.beginPath(); g.ellipse(0, bodyY, W * 0.44, H * 0.34, 0, 0, 6.29); g.stroke();
  // belly
  g.fillStyle = shade(b.color, 1.25);
  g.beginPath(); g.ellipse(W * 0.05, bodyY + H * 0.13, W * 0.3, H * 0.16, 0, 0, 6.29); g.fill();
  // breed marks
  if (b.id === 'hound' || b.id === 'dachshund') {
    g.fillStyle = shade(b.color, 0.8);
    g.beginPath(); g.ellipse(-W * 0.16, bodyY - H * 0.1, W * 0.16, H * 0.16, 0.4, 0, 6.29); g.fill();
  }
  if (b.id === 'poodle') {
    g.fillStyle = '#fff8f0';
    for (let i = -2; i <= 2; i++) {
      g.beginPath(); g.arc(i * W * 0.13, bodyY - H * 0.2, W * 0.12, 0, 6.29); g.fill();
    }
  }
  if (b.id === 'bulldog') {
    g.strokeStyle = shade(b.color, 0.75); g.lineWidth = 3;
    g.beginPath(); g.moveTo(-W * 0.3, bodyY - H * 0.24); g.lineTo(W * 0.1, bodyY - H * 0.26); g.stroke();
  }
  if (b.id === 'chihuahua') {
    g.fillStyle = shade(b.color, 0.75);
    g.beginPath(); g.ellipse(W * 0.08, bodyY + H * 0.05, W * 0.22, H * 0.2, 0, 0, 6.29); g.fill();
  }
  g.restore();

  // ---- head ----
  const headR = Math.max(11, W * 0.3);
  const hx = W * 0.42, hy = bodyY - H * 0.18 + (warn ? Math.sin(t * 30) * 1.5 : 0);
  g.save();
  g.translate(hx, hy);

  // ears
  g.fillStyle = b.color2;
  if (b.id === 'chihuahua') {
    // big pointy ears
    g.beginPath(); g.moveTo(-headR * 0.4, -headR * 0.3);
    g.lineTo(-headR * 0.9, -headR * 1.5); g.lineTo(headR * 0.1, -headR * 0.7);
    g.closePath(); g.fill();
    g.beginPath(); g.moveTo(headR * 0.3, -headR * 0.5);
    g.lineTo(headR * 0.5, -headR * 1.6); g.lineTo(headR * 0.9, -headR * 0.4);
    g.closePath(); g.fill();
  } else if (b.id === 'poodle') {
    g.beginPath(); g.arc(-headR * 0.5, -headR * 0.3, headR * 0.5, 0, 6.29); g.fill();
    g.beginPath(); g.arc(headR * 0.6, -headR * 0.2, headR * 0.45, 0, 6.29); g.fill();
    g.fillStyle = '#fff8f0';
    g.beginPath(); g.arc(0, -headR * 0.85, headR * 0.6, 0, 6.29); g.fill();
  } else if (b.id === 'hound' || b.id === 'dachshund') {
    // long floppy ears
    g.save(); g.rotate(Math.sin(t * 6) * 0.1);
    g.beginPath(); g.ellipse(-headR * 0.5, headR * 0.3, headR * 0.4, headR * 0.95, 0.2, 0, 6.29); g.fill();
    g.beginPath(); g.ellipse(headR * 0.45, headR * 0.3, headR * 0.4, headR * 0.95, -0.2, 0, 6.29); g.fill();
    g.restore();
  } else {
    // bulldog: small folded ears
    g.beginPath(); g.ellipse(-headR * 0.55, -headR * 0.55, headR * 0.4, headR * 0.32, 0.5, 0, 6.29); g.fill();
    g.beginPath(); g.ellipse(headR * 0.5, -headR * 0.6, headR * 0.4, headR * 0.32, -0.5, 0, 6.29); g.fill();
  }

  // skull
  g.fillStyle = b.color;
  g.beginPath(); g.arc(0, 0, headR, 0, 6.29); g.fill();
  g.strokeStyle = 'rgba(60,35,15,0.35)'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(0, 0, headR, 0, 6.29); g.stroke();

  // snout
  const snoutBig = (d.state === 'bark' || d.state === 'warn');
  g.fillStyle = shade(b.color, 1.2);
  g.beginPath();
  g.ellipse(headR * 0.5, headR * 0.28, headR * (snoutBig ? 0.66 : 0.58), headR * (snoutBig ? 0.5 : 0.42), 0, 0, 6.29);
  g.fill();
  // mouth (open when barking/leaping)
  if (snoutBig || d.state === 'leap') {
    const openW = 0.34 + Math.abs(Math.sin(t * 22)) * 0.3;
    g.fillStyle = '#8c3b52';
    g.beginPath(); g.ellipse(headR * 0.66, headR * 0.4, headR * 0.34, headR * openW, 0, 0, 6.29); g.fill();
    g.fillStyle = '#ff9db3';
    g.beginPath(); g.ellipse(headR * 0.62, headR * 0.5, headR * 0.2, headR * 0.16, 0, 0, 6.29); g.fill();
    // teeth
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.moveTo(headR * 0.4, headR * 0.2); g.lineTo(headR * 0.5, headR * 0.36); g.lineTo(headR * 0.6, headR * 0.2);
    g.closePath(); g.fill();
  } else {
    g.strokeStyle = '#5a3a28'; g.lineWidth = 1.6; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(headR * 0.42, headR * 0.44);
    g.quadraticCurveTo(headR * 0.6, headR * 0.56, headR * 0.8, headR * 0.4);
    g.stroke();
  }
  // nose
  g.fillStyle = '#2b2b33';
  g.beginPath(); g.ellipse(headR * 0.86, headR * 0.16, headR * 0.2, headR * 0.16, 0, 0, 6.29); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.6)';
  g.beginPath(); g.ellipse(headR * 0.8, headR * 0.1, headR * 0.06, headR * 0.05, 0, 0, 6.29); g.fill();

  // eyes — expressive
  const eyeY = -headR * 0.18;
  const wide = (d.state === 'leap' || d.state === 'chase') ? 1.2 : 1;
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(-headR * 0.12, eyeY, headR * 0.3 * wide, headR * 0.34 * wide, 0, 0, 6.29); g.fill();
  g.beginPath(); g.ellipse(headR * 0.4, eyeY, headR * 0.26 * wide, headR * 0.32 * wide, 0, 0, 6.29); g.fill();
  const pupOff = d.state === 'chase' || d.state === 'leap' ? headR * 0.12 : headR * 0.04;
  g.fillStyle = '#241c33';
  g.beginPath(); g.arc(-headR * 0.12 + pupOff, eyeY + 1, headR * 0.15, 0, 6.29); g.fill();
  g.beginPath(); g.arc(headR * 0.4 + pupOff, eyeY + 1, headR * 0.13, 0, 6.29); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(-headR * 0.12 + pupOff - 2, eyeY - 2, headR * 0.06, 0, 6.29); g.fill();
  g.beginPath(); g.arc(headR * 0.4 + pupOff - 2, eyeY - 2, headR * 0.06, 0, 6.29); g.fill();
  // eyebrows: angry when chasing
  if (d.state === 'chase' || d.state === 'leap' || d.state === 'warn') {
    g.strokeStyle = shade(b.color, 0.6); g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-headR * 0.4, eyeY - headR * 0.42); g.lineTo(headR * 0.04, eyeY - headR * 0.24); g.stroke();
    g.beginPath(); g.moveTo(headR * 0.66, eyeY - headR * 0.4); g.lineTo(headR * 0.28, eyeY - headR * 0.24); g.stroke();
  }
  // collar with tag
  g.fillStyle = '#e0405f';
  g.beginPath(); g.ellipse(-headR * 0.1, headR * 0.75, headR * 0.72, headR * 0.18, 0.1, 0, 6.29); g.fill();
  g.fillStyle = '#ffd23d';
  g.beginPath(); g.arc(-headR * 0.05, headR * 0.95, headR * 0.15, 0, 6.29); g.fill();
  g.restore();

  // ---- warning telegraph ----
  if (d.state === 'warn' || d.state === 'bark') {
    const pulse = 1 + Math.sin(t * 18) * 0.14;
    g.save();
    g.translate(0, -d.h - 16);
    g.scale(pulse, pulse);
    g.fillStyle = '#ff4d5e';
    g.beginPath();
    g.moveTo(0, -18); g.lineTo(13, 6); g.lineTo(-13, 6);
    g.closePath(); g.fill();
    g.fillStyle = '#fff';
    g.font = 'bold 17px "Trebuchet MS", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('!', 0, 0);
    g.textBaseline = 'alphabetic';
    g.restore();
    // charge dust
    if (Math.random() < 0.4) {
      FX.spawn({ x: d.x + d.w / 2 - dirF * d.w * 0.4, y: d.y + d.h, vx: -dirF * rand(20, 60), vy: rand(-40, -8),
        life: 0.3, size: rand(2, 5), color: 'rgba(255,240,210,0.8)', grav: -10, kind: 'puff' });
    }
  }

  // barking "¡guau!" bubble
  if (d.state === 'bark' && d.warnT > 0.16) {
    g.save();
    g.translate(headR * 1.1, -d.h - 6);
    g.fillStyle = '#ffffff';
    roundRectPath(g, -4, -30, 54, 24, 8); g.fill();
    g.fillStyle = '#e0405f';
    g.beginPath(); g.moveTo(2, -8); g.lineTo(-8, 2); g.lineTo(10, -4); g.closePath(); g.fill();
    g.fillStyle = '#2b2b33';
    g.font = 'bold 14px "Trebuchet MS", sans-serif';
    g.textAlign = 'center';
    g.fillText('¡guau!', 23, -13);
    g.restore();
  }

  g.restore();

  drawDogLabel(g, d, sx, same);
}

function drawDogLabel(g, d, sx, same) {
  if (!same) return;
  if (d.state !== 'chase' && d.state !== 'leap') return;
  g.save();
  g.globalAlpha = 0.85;
  g.fillStyle = 'rgba(20,10,40,0.65)';
  roundRectPath(g, sx + d.w / 2 - 44, d.y - 26, 88, 17, 8); g.fill();
  g.fillStyle = '#ffe66d';
  g.font = 'bold 11px "Trebuchet MS", sans-serif';
  g.textAlign = 'center';
  g.fillText(d.breed.name, sx + d.w / 2, d.y - 14);
  g.restore();
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g2 = (n >> 8) & 255, b2 = n & 255;
  r = clamp(Math.round(r * k), 0, 255);
  g2 = clamp(Math.round(g2 * k), 0, 255);
  b2 = clamp(Math.round(b2 * k), 0, 255);
  return 'rgb(' + r + ',' + g2 + ',' + b2 + ')';
}

// ============================================================
// UI  (HUD + overlays + buttons + shop)
// ============================================================
const UI = {
  buttons: [],
  shopOpen: false,
  guideOpen: false,
  hoverBtn: -1,
  blink: 0,

  toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) / Math.max(1, r.width) * VIEW_W,
      y: (clientY - r.top) / Math.max(1, r.height) * VIEW_H
    };
  },

  bind() {
    canvas.addEventListener('pointerdown', (ev) => {
      AudioSys.init(); AudioSys.resume();
      const p = this.toLogical(ev.clientX, ev.clientY);
      for (const b of this.buttons) {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          ev.preventDefault();
          AudioSys.uiClick();
          b.action();
          return;
        }
      }
      // clicking anywhere on the menu starts the game
      if (Game.state === STATE.MENU && !this.shopOpen && !this.guideOpen) Game.startFromMenu();
    });

    canvas.addEventListener('pointermove', (ev) => {
      const p = this.toLogical(ev.clientX, ev.clientY);
      let h = -1;
      for (let i = 0; i < this.buttons.length; i++) {
        const b = this.buttons[i];
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) h = i;
      }
      this.hoverBtn = h;
      canvas.style.cursor = h >= 0 ? 'pointer' : 'default';
    });
  },

  panel(g, x, y, w, h, title) {
    g.save();
    g.fillStyle = 'rgba(14,12,34,0.82)';
    roundRectPath(g, x, y, w, h, 16); g.fill();
    g.strokeStyle = 'rgba(255,230,120,0.75)'; g.lineWidth = 3;
    roundRectPath(g, x, y, w, h, 16); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.06)';
    roundRectPath(g, x + 6, y + 6, w - 12, h - 12, 12); g.fill();
    if (title) {
      g.fillStyle = '#ffe66d';
      g.font = 'bold 26px "Trebuchet MS", sans-serif';
      g.textAlign = 'center';
      g.fillText(title, x + w / 2, y + 40);
    }
    g.restore();
  },

  button(g, x, y, w, h, label, action, opt) {
    const idx = this.buttons.length;
    const hot = this.hoverBtn === idx;
    const disabled = opt && opt.disabled;
    g.save();
    g.fillStyle = disabled ? 'rgba(80,80,110,0.6)' : (hot ? '#ffd23d' : (opt && opt.color) || '#ff8a4c');
    roundRectPath(g, x, y, w, h, 12); g.fill();
    g.strokeStyle = disabled ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.85)';
    g.lineWidth = hot ? 3.5 : 2;
    roundRectPath(g, x, y, w, h, 12); g.stroke();
    g.fillStyle = disabled ? 'rgba(255,255,255,0.55)' : ((opt && opt.textColor) || '#2a1a10');
    g.font = 'bold ' + ((opt && opt.font) || 20) + 'px "Trebuchet MS", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, x + w / 2, y + h / 2 + 1);
    g.textBaseline = 'alphabetic';
    g.restore();
    this.buttons.push({ x, y, w, h, action, disabled });
  },

  // ---------- HUD ----------
  drawHUD(g) {
    this.buttons = [];     // HUD is not clickable; overlays rebuild their own
    g.save();
    // score
    g.textAlign = 'left';
    g.font = 'bold 30px "Trebuchet MS", sans-serif';
    g.fillStyle = 'rgba(0,0,0,0.35)';
    roundRectPath(g, 12, 10, 210, 74, 12); g.fill();
    g.fillStyle = '#ffffff';
    g.fillText(String(Game.score).padStart(6, '0'), 24, 44);
    g.font = 'bold 13px "Trebuchet MS", sans-serif';
    g.fillStyle = '#ffe66d';
    g.fillText('MEJOR: ' + Store.data.best, 24, 66);
    if (Game.combo > 1) {
      const pop = 1 + Math.min(0.4, (3 - (Game.comboTimer % 3)) * 0.12);
      g.save();
      g.translate(232, 34);
      g.scale(pop, pop);
      g.fillStyle = '#8affea';
      g.font = 'bold 24px "Trebuchet MS", sans-serif';
      g.fillText('x' + Game.combo + ' COMBO', 0, 10);
      g.restore();
      // combo timer bar
      g.fillStyle = 'rgba(0,0,0,0.4)';
      g.fillRect(232, 46, 130, 8);
      g.fillStyle = '#8affea';
      g.fillRect(232, 46, 130 * clamp(Game.comboTimer / 3, 0, 1), 8);
    }

    // realm pill (top center)
    const moon = Game.realm === REALM.MOON;
    const rx = VIEW_W / 2 - 110, ry = 14, rw = 220, rh = 34;
    g.fillStyle = moon ? 'rgba(70,55,140,0.85)' : 'rgba(255,170,60,0.9)';
    roundRectPath(g, rx, ry, rw, rh, 17); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    roundRectPath(g, rx, ry, rw, rh, 17); g.stroke();
    g.fillStyle = '#fff';
    g.font = 'bold 16px "Trebuchet MS", sans-serif';
    g.textAlign = 'center';
    g.fillText((moon ? '🌙 ' : '☀️ ') + REALM.name(Game.realm) + '  [K]', VIEW_W / 2, ry + 23);

    // right side stats
    g.textAlign = 'right';
    g.font = 'bold 15px "Trebuchet MS", sans-serif';
    g.fillStyle = 'rgba(0,0,0,0.35)';
    roundRectPath(g, VIEW_W - 218, 56, 206, 84, 12); g.fill();
    g.fillStyle = '#ffd23d';
    g.fillText('🔔 Campanas: ' + Store.data.totalBells, VIEW_W - 24, 80);
    g.fillStyle = '#7fe9ff';
    g.fillText('🐟 Pescados: ' + Game.fishCaught, VIEW_W - 24, 102);
    g.fillStyle = '#ff9f68';
    g.fillText('🐕 Esquivados: ' + Game.dogsDodged, VIEW_W - 24, 124);
    g.textAlign = 'left';

    // distance
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.font = 'bold 14px "Trebuchet MS", sans-serif';
    g.fillText(Math.floor(Game.distance / 10) + ' m', 24, 96);

    // center message
    if (Game.messageT > 0) {
      const a = clamp(Game.messageT, 0, 1);
      const t = clamp((2.2 - Game.messageT) * 5, 0, 1);
      g.save();
      g.globalAlpha = Math.min(a * 1.6, 1);
      g.translate(VIEW_W / 2, 118 - (1 - t) * 8);
      const w = g.measureText(Game.message).width + 60;
      g.font = 'bold 24px "Trebuchet MS", sans-serif';
      const mw = g.measureText(Game.message).width + 56;
      g.fillStyle = 'rgba(20,14,44,0.78)';
      roundRectPath(g, -mw / 2, -30, mw, 42, 21); g.fill();
      g.strokeStyle = '#ffe66d'; g.lineWidth = 2.5;
      roundRectPath(g, -mw / 2, -30, mw, 42, 21); g.stroke();
      g.fillStyle = '#ffffff';
      g.textAlign = 'center';
      g.fillText(Game.message, 0, -2);
      g.restore();
    }
    g.restore();
  },

  controlsText() {
    return [
      ['Moverse', '← →  o  A / D'],
      ['Saltar (doble)', 'Espacio / W / ↑  (mantener = más alto)'],
      ['Dash', 'Shift  o  J'],
      ['Cambiar de reino', 'K  (Sol ↔ Luna)'],
      ['Pausa', 'P  o  Esc'],
      ['Silenciar', 'M'],
      ['Táctil', 'Botones en pantalla']
    ];
  },

  // ---------- overlays ----------

    this.buttons = [];
    // dim

    g.fillRect(0, 0, VIEW_W, VIEW_H);

    g.restore();

    // hero scene: kitten + approaching dog (raised so the buttons never cover them)
    const hy = GROUND_Y - 78;
    g.fillStyle = Game.realm === REALM.MOON ? '#5e4a97' : '#8fd97a';
    g.fillRect(0, hy, VIEW_W, VIEW_H - hy);
    g.fillStyle = Game.realm === REALM.MOON ? '#8a76d8' : '#a8e88f';
    g.fillRect(0, hy, VIEW_W, 7);
    // buildings
    g.fillStyle = Game.realm === REALM.MOON ? '#2a2350' : '#f3c9a0';
    g.fillRect(VIEW_W - 240, hy - 170, 140, 170);
    g.fillRect(VIEW_W - 380, hy - 120, 110, 120);

      vx: 100, vy: 0, realm: 2, state: 'chase', dir: 1, cycle: Game.time * 9, t: Game.time, alpha: 1, dodged: false
    };
    drawDog(g, demo, Game.camX);

    // start prompt
    if (!this.shopOpen && !this.guideOpen) {
      const blink = (Math.sin(Game.time * 4) + 1) / 2;
      g.globalAlpha = 0.4 + blink * 0.6;
      g.fillStyle = '#ffe66d';
      g.font = 'bold 30px "Trebuchet MS", sans-serif';
      g.textAlign = 'center';
      g.fillText(Input.isTouch ? 'Toca para empezar' : 'Pulsa ESPACIO para empezar', VIEW_W / 2, 168);
      g.globalAlpha = 1;

    // best score (hidden while a modal overlay owns the screen)
    if (!this.shopOpen && !this.guideOpen) {
      g.fillStyle = 'rgba(0,0,0,0.35)';
      roundRectPath(g, VIEW_W / 2 - 150, 186, 300, 40, 12); g.fill();
      g.fillStyle = '#fff';
      g.font = 'bold 18px "Trebuchet MS", sans-serif';

    // always-visible control guide strip (full panel behind "CONTROLES")
    if (!this.shopOpen && !this.guideOpen) {
      const chips = [
        ['← →', 'Mover'], ['ESPACIO', 'Saltar'], ['SHIFT', 'Dash'],
        ['K', 'Reino'], ['P', 'Pausa'], ['M', 'Sonido']
      ];
      g.font = 'bold 13px "Trebuchet MS", sans-serif';
      const cw = 138, cg = 8;
      const total = chips.length * cw + (chips.length - 1) * cg;
      let cxp = VIEW_W / 2 - total / 2;
      for (const [k, lbl] of chips) {
        g.fillStyle = 'rgba(16,14,40,0.78)';
        roundRectPath(g, cxp, 236, cw, 44, 10); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1.5;
        roundRectPath(g, cxp, 236, cw, 44, 10); g.stroke();
        g.fillStyle = '#ffe66d';
        g.fillText(k, cxp + cw / 2, 254);

// ============================================================
// FX RENDERER  (particles, popups, flash)
// ============================================================
function drawPawPrint(g, s) {
  // s: size
  g.beginPath(); g.ellipse(0, s * 0.35, s * 0.62, s * 0.5, 0, 0, 6.29); g.fill();
  g.beginPath(); g.arc(-s * 0.6, -s * 0.35, s * 0.28, 0, 6.29); g.fill();
  g.beginPath(); g.arc(-s * 0.18, -s * 0.62, s * 0.28, 0, 6.29); g.fill();
  g.beginPath(); g.arc(s * 0.28, -s * 0.6, s * 0.28, 0, 6.29); g.fill();
  g.beginPath(); g.arc(s * 0.66, -s * 0.2, s * 0.26, 0, 6.29); g.fill();
}

function drawFX(g, camX) {
  for (const p of FX.parts) {
    const sx = p.x - camX;
    if (sx < -60 || sx > VIEW_W + 60) continue;
    const a = clamp(p.life / p.max, 0, 1) * p.alpha;
    g.save();
    g.globalAlpha = a;
    g.fillStyle = p.color;
    g.strokeStyle = p.color;
    g.translate(sx, p.y);
    switch (p.kind) {
      case 'fur':
        g.rotate(p.rot);
        g.beginPath();
        g.ellipse(0, 0, p.size * 1.6, p.size * 0.6, 0, 0, 6.29);
        g.fill();
        break;
      case 'spark': {
        g.rotate(p.rot);
        const s = p.size * (0.6 + a * 0.9);
        g.beginPath();
        g.moveTo(0, -s * 1.6); g.lineTo(s * 0.4, -s * 0.4);
        g.lineTo(s * 1.6, 0); g.lineTo(s * 0.4, s * 0.4);
        g.lineTo(0, s * 1.6); g.lineTo(-s * 0.4, s * 0.4);
        g.lineTo(-s * 1.6, 0); g.lineTo(-s * 0.4, -s * 0.4);
        g.closePath(); g.fill();
        break;
      }
      case 'puff':
        g.globalAlpha = a * 0.55;
        g.beginPath(); g.arc(0, 0, p.size * (1.6 - a), 0, 6.29); g.fill();
        break;
      case 'print':
        g.rotate(p.rot);
        g.globalAlpha = a * 0.75;
        drawPawPrint(g, p.size * 0.9);
        break;
      case 'ring':
        g.globalAlpha = a * 0.6;
        g.lineWidth = 3;
        g.beginPath(); g.arc(0, 0, p.size * (1 + (1 - a) * 3), 0, 6.29); g.stroke();
        break;
      default:
        g.beginPath(); g.arc(0, 0, p.size * (0.5 + a * 0.7), 0, 6.29); g.fill();
    }
    g.restore();
  }

  // score popups
  for (const u of FX.popups) {
    const sx = u.x - camX;
    const a = clamp(u.life / u.max, 0, 1);
    g.save();
    g.globalAlpha = a;
    g.textAlign = 'center';
    g.font = 'bold ' + (u.big ? 26 : 19) + 'px "Trebuchet MS", sans-serif';
    g.lineWidth = 4;
    g.strokeStyle = 'rgba(20,10,40,0.85)';
    g.strokeText(u.text, sx, u.y);
    g.fillStyle = u.color;
    g.fillText(u.text, sx, u.y);
    g.restore();
  }

  // screen flash
  if (FX.flashT > 0) {
    const a = clamp(FX.flashT / Math.max(0.001, FX.flashDur), 0, 1);
    g.save();
    g.globalAlpha = a * 0.55;
    g.fillStyle = 'rgba(' + FX.flashColor + ',1)';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.restore();
  }
}

// ============================================================
// GAME FLOW METHODS
// ============================================================
Game.startFromMenu = function () {
  UI.shopOpen = false; UI.guideOpen = false;
  Game.best = Store.data.best;
  Game.deaths = Store.data.deaths || 0;
  Game.reset();
};

Game.resume = function () { Game.state = STATE.PLAYING; };

Game.toMenu = function () {
  Game.state = STATE.MENU;
  UI.shopOpen = false; UI.guideOpen = false;
  FX.clear();
  Parallax.init();
};

Game.togglePause = function () {
  if (Game.state === STATE.PLAYING) Game.state = STATE.PAUSED;
  else if (Game.state === STATE.PAUSED) Game.state = STATE.PLAYING;
  Input.releaseAll();
};

// ============================================================
// MAIN LOOP  (rAF + delta time, blur auto-pause, DPR aware)
// ============================================================
const App = {
  lastT: 0, running: false, overT: 0, restartReq: false,

  init() {
    Store.load();
    AudioSys.muted = !!Store.data.muted;
    Game.best = Store.data.best || 0;
    Game.deaths = Store.data.deaths || 0;
    Game.cosmetic.hat = Store.data.hats.length ? Store.data.hats[0] : 'none';
    Game.cosmetic.tint = Store.data.tints.length ? Store.data.tints[0] : null;
    Game.cosmetic.collar = !!Store.data.collar;

    Parallax.init();
    WORLD.reset();
    Collect.reset();
    DogMgr.reset();
    Kitten.respawn();
    Kitten.pose = 'run';

    Input.bindKeyboard();
    Input.bindTouch();
    UI.bind();

    // audio unlocks only after a real user gesture
    const unlock = () => {
      AudioSys.init();
      AudioSys.resume();
      if (AudioSys.muted && AudioSys.master) AudioSys.master.gain.value = 0;
    };
    window.addEventListener('pointerdown', unlock, { once: false });
    window.addEventListener('keydown', unlock, { once: false });

    // pause when the tab loses focus
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && Game.state === STATE.PLAYING) {
        Game.state = STATE.PAUSED;
        Input.releaseAll();
      }
    });
    window.addEventListener('blur', () => {
      if (Game.state === STATE.PLAYING) {
        Game.state = STATE.PAUSED;
        Input.releaseAll();
      }
    });
    window.addEventListener('beforeunload', () => { Store.save(); });
  },

  update(dt) {
    Game.time += dt;    // global animation clock (runs in every state)

    // --- global controls ---
    if (Input.pausePressed && (Game.state === STATE.PLAYING || Game.state === STATE.PAUSED)) {
      Game.togglePause();
    }

    if (Game.state === STATE.MENU) {
      Game.camX += 46 * dt;
      if (Game.camX > 100000) Game.camX = 0;
      WORLD.ensureAhead(VIEW_W);
      Parallax.update(dt, Game.camX);
      FX.update(dt);
      if (Input.jumpPressed && !UI.shopOpen && !UI.guideOpen) Game.startFromMenu();
      Input.endFrame();
      return;
    }

    if (Game.state === STATE.PAUSED) {
      FX.update(dt * 0.2);
      Input.endFrame();
      return;
    }

    if (Game.state === STATE.GAMEOVER) {
      App.overT += dt;
      Game.overT = App.overT;
      Parallax.update(dt, Game.camX);
      FX.update(dt);
      WORLD.ensureAhead(VIEW_W);
      // buffer the press instead of losing it on the guard frame
      if (Input.jumpPressed) App.restartReq = true;
      if (App.restartReq && App.overT > 0.1) {
        App.restartReq = false;
        Game.restartNow();
      }
      Input.endFrame();
      return;
    }

    // ---------- PLAYING ----------
    if (Input.phasePressed) Game.switchRealm();

    WORLD.update();
    Kitten.update(dt, dt);

    if (!Kitten.caught) {
      DogMgr.update(dt);
      Collect.update(dt);
      Game.distance = Math.max(Game.distance, Kitten.x - 120);

      // reward for clearing obstacles (jump over crates / fences / walls)
      for (const p of WORLD.plats) {
        if (p.type === 'ground' || p.type === 'plat') continue;
        if (!p.passed && p.x > Game.camX - 200 && Kitten.x > p.x + p.w) {
          p.passed = true;
          Game.score += 15;
          FX.popup(p.x + p.w / 2, p.y - 14, '+15', '#ffffff', false);
          FX.burst(p.x + p.w / 2, p.y - 6, 4, { color: '#ffffff', kind: 'spark', spMax: 70, grav: 60 });
        }
      }
    }

    Game.tick(dt);
    Parallax.update(dt, Game.camX);
    FX.update(dt);

    // camera follow (frame-rate independent smoothing)
    const target = Kitten.x - VIEW_W * 0.32;
    const k = 1 - Math.pow(0.0008, dt);
    Game.camX += (target - Game.camX) * k;
    if (Game.camX < -60) Game.camX = -60;

    // scared / happy expressions
    let scared = false;
    for (const d of DogMgr.dogs) {
      if (d.alpha < 0.5) continue;
      if (d.realm !== Game.realm && d.realm !== 2) continue;
      if (d.state === 'hide') continue;
      const dx = Math.abs((d.x + d.w / 2) - Kitten.cx);
      const dy = Math.abs((d.y + d.h / 2) - Kitten.cy);
      if (dx < 190 && dy < 120 && (d.state === 'chase' || d.state === 'leap' || d.state === 'warn' || d.state === 'bark')) {
        scared = true; break;
      }
    }
    Kitten.scared = scared;

    // realm-switch ghost trail: glowing prints behind the kitten
    if (Game.realmGhost > 0 && Math.random() < 0.6) {
      FX.pawPrint(Kitten.cx + rand(-26, 12), Kitten.y + Kitten.h - rand(0, 6), true, chance(0.5));
      FX.sparkle(Kitten.cx + rand(-30, 20), Kitten.cy + rand(-24, 24), ['#ffe66d', '#9d8cff', '#8affea']);
    }

    // idle meow flavour: Michi gets chatty when nobody moves
    if (Kitten.onGround && !Kitten.caught && Math.abs(Kitten.vx) < 8) {
      App._idleT = (App._idleT || 0) + dt;
      if (App._idleT > 5) { AudioSys.meow(rand(0.9, 1.15)); App._idleT = -rand(3, 7); }
    } else {
      App._idleT = 0;
    }

    Input.endFrame();
  },

  render() {
    const g = ctx;
    const cam = Game.camX;
    const off = FX.shakeOffset();
    g.save();
    g.setTransform(scale, 0, 0, scale, 0, 0);
    g.translate(off.x, off.y);

    drawSky(g, cam);

    if (Game.state === STATE.MENU) {
      g.save(); g.globalAlpha = 0.88;   // town reads as background, not playfield
      drawParallaxTown(g, cam);
      g.restore();
      drawFX(g, cam);
      UI.drawMenu(g);
      g.restore();
      return;
    }

    g.save(); g.globalAlpha = 0.88;
    drawParallaxTown(g, cam);
    g.restore();
    drawGround(g, cam);
    drawDeco(g, cam);        // scenery sits BEHIND jumpable solids
    drawPlatforms(g, cam);
    Collect.draw(g, cam);

    // dogs (back to front)
    for (const d of DogMgr.dogs) drawDog(g, d, cam);

    // ghost silhouette from the last realm switch
    if (Game.realmGhost > 0) {
      const a = clamp(Game.realmGhost / 0.4, 0, 1);
      drawKitten(g, Kitten.cx - cam - Kitten.face * 16, Kitten.y + Kitten.h,
        { alpha: a * 0.4, ghost: true, pose: Kitten.pose });
    }

    // the kitten
    drawKitten(g, Kitten.cx - cam, Kitten.y + Kitten.h, {});

    drawFX(g, cam);
    UI.drawHUD(g);

    if (Game.state === STATE.PAUSED) UI.drawPause(g);
    else if (Game.state === STATE.GAMEOVER) UI.drawGameOver(g);

    g.restore();
  },

  frame(now) {
    if (!App.running) return;
    App.raf = requestAnimationFrame(App.frame);
    let dt = (now - App.lastT) / 1000;
    App.lastT = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.25) dt = 0.033;        // returning from a hidden tab
    if (dt <= 0) dt = 1 / 60;

    try {
      App.update(dt);
      App.render();
    } catch (err) {
      // never let one bad frame kill the loop; surface it once
      if (!App._errShown) {
        App._errShown = true;
        if (window.console) console.error('[michi-run]', err);
      }
    }
  },

  start() {
    if (App.running) return;
    App.running = true;
    App.lastT = performance.now();
    App.raf = requestAnimationFrame(App.frame);
  },

  stop() {
    App.running = false;
    if (App.raf) cancelAnimationFrame(App.raf);
    Store.save();
  }
};

// mute toggle persistence helper (key M)
const _origToggle = AudioSys.toggleMute.bind(AudioSys);
AudioSys.toggleMute = function () {
  const m = _origToggle();
  Store.data.muted = m;
  Store.save();
  return m;
};

// ---------- boot ----------
resize();
App.init();
if (document.readyState === 'complete' || document.readyState === 'interactive') App.start();
else window.addEventListener('DOMContentLoaded', () => App.start());
window.addEventListener('pagehide', () => App.stop());

// BUILD:END
</script>
